# 求解配置
# 基于约束定义自动生成
#
# 依赖关系分析：
# - IMPLICIT-SHAPE-permutedTokens: permutedTokens.shape <- permutedTokens.dimensions (隐式)
# - IMPLICIT-RANGE-permutedTokens: permutedTokens.value_range <- permutedTokens.dtype (隐式)
# - IMPLICIT-SHAPE-sortedIndices: sortedIndices.shape <- sortedIndices.dimensions (隐式)
# - IMPLICIT-RANGE-sortedIndices: sortedIndices.value_range <- sortedIndices.dtype (隐式)
# - IMPLICIT-SHAPE-probsOptional: probsOptional.shape <- probsOptional.dimensions (隐式)
# - IMPLICIT-RANGE-probsOptional: probsOptional.value_range <- probsOptional.dtype (隐式)
# - IMPLICIT-RANGE-rangeOptional: rangeOptional.value_range <- rangeOptional.dtype (隐式)
# - IMPLICIT-LENGTH-rangeOptional: rangeOptional.length <- rangeOptional.length_ranges (隐式)
# - IMPLICIT-VALUE-LIST-rangeOptional: rangeOptional.value <- rangeOptional.length, rangeOptional.value_range (隐式)
# - IMPLICIT-RANGE-restoreShapeOptional: restoreShapeOptional.value_range <- restoreShapeOptional.dtype (隐式)
# - IMPLICIT-LENGTH-restoreShapeOptional: restoreShapeOptional.length <- restoreShapeOptional.length_ranges (隐式)
# - IMPLICIT-VALUE-LIST-restoreShapeOptional: restoreShapeOptional.value <- restoreShapeOptional.length, restoreShapeOptional.value_range (隐式)
# - IMPLICIT-SHAPE-out: out.shape <- out.dimensions (隐式)
# - C-TYPE-001: out.dtype <- permutedTokens.dtype
# - C-SHAPE-001: out.shape <- permutedTokens.shape, sortedIndices.shape

solver:
  strategy: topological

  # ========== 锚点因子 ==========
  # 定义：入度为0的因子，无依赖，可独立随机采样
  anchors:
    # 类型锚点
    - numTopk.dtype
    - numTopk.value
    - paddedMode.dtype
    - paddedMode.value
    - permutedTokens.dtype
    - probsOptional.dtype
    - rangeOptional.dtype
    - restoreShapeOptional.dtype
    - sortedIndices.dtype
    # 固定值因子（无依赖）
    - numTopk.exist
    - out.dimensions
    - out.exist
    - out.format
    - paddedMode.exist
    - permutedTokens.dimensions
    - permutedTokens.exist
    - permutedTokens.format
    - probsOptional.dimensions
    - probsOptional.exist
    - probsOptional.format
    - rangeOptional.exist
    - rangeOptional.length_ranges
    - restoreShapeOptional.exist
    - restoreShapeOptional.length_ranges
    - sortedIndices.dimensions
    - sortedIndices.exist
    - sortedIndices.format

  # ========== 推导顺序 ==========
  derivation_order:
    # Level 0: 锚点因子（无依赖，可独立采样）
    level_0:
      - numTopk.dtype
      - numTopk.exist
      - numTopk.value
      - out.dimensions
      - out.exist
      - out.format
      - paddedMode.dtype
      - paddedMode.exist
      - paddedMode.value
      - permutedTokens.dimensions
      - permutedTokens.dtype
      - permutedTokens.exist
      - permutedTokens.format
      - probsOptional.dimensions
      - probsOptional.dtype
      - probsOptional.exist
      - probsOptional.format
      - rangeOptional.dtype
      - rangeOptional.exist
      - rangeOptional.length_ranges
      - restoreShapeOptional.dtype
      - restoreShapeOptional.exist
      - restoreShapeOptional.length_ranges
      - sortedIndices.dimensions
      - sortedIndices.dtype
      - sortedIndices.exist
      - sortedIndices.format
    # Level 1: 从前面层级推导
    #   - out.dtype <- [permutedTokens.dtype]
    #   - permutedTokens.shape <- [permutedTokens.dimensions]
    #   - permutedTokens.value_range <- [permutedTokens.dtype]
    #   - probsOptional.shape <- [probsOptional.dimensions]
    #   - probsOptional.value_range <- [probsOptional.dtype]
    #   ... (+6 more)
    level_1:
      - out.dtype
      - permutedTokens.shape
      - permutedTokens.value_range
      - probsOptional.shape
      - probsOptional.value_range
      - rangeOptional.length
      - rangeOptional.value_range
      - restoreShapeOptional.length
      - restoreShapeOptional.value_range
      - sortedIndices.shape
      - sortedIndices.value_range
    # Level 2: 从前面层级推导
    #   - out.shape <- [out.dimensions, permutedTokens.shape, sortedIndices.shape]
    #   - rangeOptional.value <- [rangeOptional.length, rangeOptional.value_range]
    #   - restoreShapeOptional.value <- [restoreShapeOptional.length, restoreShapeOptional.value_range]
    level_2:
      - out.shape
      - rangeOptional.value
      - restoreShapeOptional.value

