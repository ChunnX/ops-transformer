operator: "mega_moe_dispatch_ffn_combine"
version: "1.0"
description: "dispatch_ffn_combine算子参数定义 - bf16输入fp8mx量化bf16输出场景"

parameters:
  # ==================== INPUT TENSORS ====================
  - name: "context"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: ["ND"]
    dimensions: [1]
    dtype_with_ranges:
      - dtype: "int32"
        value_range: []

  - name: "x"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: ["ND"]
    dimensions: [2]
    dtype_with_ranges:
      - dtype: "bfloat16"
        value_range: [[-10, 10], [-1, 1], [0, 1], [-0.1, 0.1], [-100, 100]]

  - name: "topk_ids"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: ["ND"]
    dimensions: [2]
    dtype_with_ranges:
      - dtype: "int32"
        value_range: []

  - name: "topk_weights"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: ["ND"]
    dimensions: [2]
    dtype_with_ranges:
      - dtype: "float32"
        value_range: [[0, 1], [0, 0.5], [0.5, 1], [0.001, 0.1]]
      - dtype: "bfloat16"
        value_range: [[0, 1], [0, 0.5], [0.5, 1], [0.001, 0.1]]

  - name: "weight1"
    type: "aclTensorList"
    required: true
    io_type: "input"
    format: ["ND"]
    dimensions: [3]
    dtype_with_ranges:
      - dtype: "float8_e5m2"
        value_range: [[-1, 1], [-0.1, 0.1], [0, 1]]
      - dtype: "float8_e4m3fn"
        value_range: [[-1, 1], [-0.1, 0.1], [0, 1]]

  - name: "weight2"
    type: "aclTensorList"
    required: true
    io_type: "input"
    format: ["ND"]
    dimensions: [3]
    dtype_with_ranges:
      - dtype: "float8_e5m2"
        value_range: [[-1, 1], [-0.1, 0.1], [0, 1]]
      - dtype: "float8_e4m3fn"
        value_range: [[-1, 1], [-0.1, 0.1], [0, 1]]

  # ==================== OPTIONAL INPUT TENSORS ====================
  - name: "weight_scales1"
    type: "aclTensorList"
    required: false
    io_type: "input"
    format: ["ND"]
    dimensions: [3, 2]
    dtype_with_ranges:
      - dtype: "float32"
        value_range: [[0.001, 10], [0.1, 1], [1, 100]]
      - dtype: "float8_e8m0"
        value_range: [[0.001, 10], [0.1, 1], [1, 100]]

  - name: "weight_scales2"
    type: "aclTensorList"
    required: false
    io_type: "input"
    format: ["ND"]
    dimensions: [3, 2]
    dtype_with_ranges:
      - dtype: "float32"
        value_range: [[0.001, 10], [0.1, 1], [1, 100]]
      - dtype: "float8_e8m0"
        value_range: [[0.001, 10], [0.1, 1], [1, 100]]

  - name: "x_active_mask"
    type: "aclTensor"
    required: false
    io_type: "input"
    format: ["ND"]
    dimensions: [1, 2]
    dtype_with_ranges:
      - dtype: "int8"
        value_range: [[0, 1]]

  - name: "scales"
    type: "aclTensor"
    required: false
    io_type: "input"
    format: ["ND"]
    dimensions: [2]
    dtype_with_ranges:
      - dtype: "float32"
        value_range: [[0.001, 10], [0.1, 1], [1, 100]]
      - dtype: "float8_e8m0"
        value_range: [[0.001, 10], [0.1, 1], [1, 100]]

  # ==================== OUTPUT TENSORS ====================
  - name: "y"
    type: "aclTensor"
    required: true
    io_type: "output"
    format: ["ND"]
    dimensions: [2]
    dtype_with_ranges:
      - dtype: "bfloat16"
        value_range: []

  - name: "expert_token_nums"
    type: "aclTensor"
    required: true
    io_type: "output"
    format: ["ND"]
    dimensions: [1]
    dtype_with_ranges:
      - dtype: "int32"
        value_range: []

  # ==================== REQUIRED ATTRIBUTES ====================
  - name: "moe_expert_num"
    type: "int"
    required: true
    io_type: "attribute"
    is_enum: false
    dtype_with_values:
      - dtype: "int32"
        value_range: []

  - name: "ep_world_size"
    type: "int"
    required: true
    io_type: "attribute"
    is_enum: false
    dtype_with_values:
      - dtype: "int32"
        value_range: []

  - name: "ccl_buffer_size"
    type: "int"
    required: true
    io_type: "attribute"
    is_enum: false
    dtype_with_values:
      - dtype: "int32"
        value_range: []

  # ==================== OPTIONAL ATTRIBUTES ====================
  - name: "max_recv_token_num"
    type: "int"
    required: false
    io_type: "attribute"
    is_enum: false
    dtype_with_values:
      - dtype: "int32"
        default_value: 0
        value_range: [0, 65536]

  - name: "dispatch_quant_mode"
    type: "int"
    required: false
    io_type: "attribute"
    is_enum: true
    dtype_with_values:
      - dtype: "int32"
        enum_values: [0, 2, 3, 4]
        default_value: 0
        description: "0=非量化, 2=pertensor, 3=per-group, 4=mxfp8/fp4量化"

  - name: "dispatch_quant_out_type"
    type: "int"
    required: false
    io_type: "attribute"
    is_enum: true
    dtype_with_values:
      - dtype: "int32"
        enum_values: [0, 40, 41]  # 0=DT_UNDEFINED, 40=FP8_E5M2, 41=FP8_E4M3
        default_value: 0
        description: "0=DT_UNDEFINED, 40=FP8_E5M2, 41=FP8_E4M3"

  - name: "combine_quant_mode"
    type: "int"
    required: false
    io_type: "attribute"
    is_enum: true
    dtype_with_values:
      - dtype: "int32"
        enum_values: [0]
        default_value: 0
        description: "0=非量化"

  - name: "comm_alg"
    type: "str"
    required: false
    io_type: "attribute"
    is_enum: false
    dtype_with_values:
      - dtype: "str"
        default_value: ""
        value_range: [""]

  - name: "global_bs"
    type: "int"
    required: false
    io_type: "attribute"
    is_enum: false
    dtype_with_values:
      - dtype: "int32"
        default_value: 0
        value_range: [0, 512]
        description: "0表示使用默认值maxBS*ep_world_size"
