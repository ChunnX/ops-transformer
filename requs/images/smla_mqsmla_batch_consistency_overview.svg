<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">SMLA and MQSMLA batch consistency overview</title>
  <desc id="desc">Dimensions, layouts, two-stage execution, FA and FD, and four black-box consistency modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e6"/>
      <stop offset="1" stop-color="#dce9e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17342d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1f6655"/>
    </marker>
    <style>
      .title { font: 700 42px 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif; fill: #17342d; }
      .subtitle { font: 500 21px 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif; fill: #416057; }
      .head { font: 700 25px 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif; fill: #17342d; }
      .body { font: 500 19px 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif; fill: #27443c; }
      .small { font: 500 16px 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif; fill: #49655d; }
      .code { font: 600 18px 'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace; fill: #143c34; }
      .panel { fill: #fffdf8; stroke: #91ad9f; stroke-width: 2; rx: 20; filter: url(#shadow); }
      .accent { fill: #e25f3f; }
      .teal { fill: #1f6655; }
      .gold { fill: #d39a2c; }
      .line { stroke: #1f6655; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1480" cy="90" r="150" fill="#e7b95f" opacity="0.22"/>
  <circle cx="80" cy="890" r="190" fill="#3a8b76" opacity="0.13"/>
  <text x="70" y="72" class="title">SMLA / MQSMLA batch 一致性，一张图看懂</text>
  <text x="72" y="108" class="subtitle">目标：同一个 query token 的数学输入不变时，batch、拆分和调度变化不改变输出 bit</text>

  <rect x="60" y="145" width="465" height="285" class="panel"/>
  <rect x="82" y="168" width="9" height="36" class="accent" rx="4"/>
  <text x="108" y="196" class="head">1. 维度与一个 token</text>
  <text x="92" y="238" class="code">Q:  [B, S1, N1, D]</text>
  <text x="92" y="272" class="code">KV: [B, S2, N2, D]</text>
  <text x="92" y="314" class="body">B 批数；S1 是 Q token 数；S2 是 KV 长度</text>
  <text x="92" y="348" class="body">N1/N2 是 Q/KV head 数；D 是每个 head 维度</text>
  <text x="92" y="382" class="body">G=N1/N2：一个 KV head 服务 G 个 Q head</text>
  <text x="92" y="414" class="small">本需求中的 token 通常指 (batch, query position)</text>

  <rect x="565" y="145" width="470" height="285" class="panel"/>
  <rect x="587" y="168" width="9" height="36" class="gold" rx="4"/>
  <text x="613" y="196" class="head">2. 三种 layout</text>
  <text x="595" y="239" class="code">BSND</text>
  <text x="690" y="239" class="body">B 显式存在，padding 到相同 S</text>
  <text x="595" y="288" class="code">TND</text>
  <text x="690" y="288" class="body">各 batch token 拼成 T，cu_seqlens 分段</text>
  <text x="595" y="337" class="code">PA_BBND</text>
  <text x="720" y="337" class="body">KV 放物理 block，block_table 做映射</text>
  <text x="595" y="385" class="small">T = 所有 batch 有效 token 数之和</text>
  <text x="595" y="411" class="small">变换时 Q、KV、长度、稀疏索引和 block table 必须同步</text>

  <rect x="1075" y="145" width="465" height="285" class="panel"/>
  <rect x="1097" y="168" width="9" height="36" class="teal" rx="4"/>
  <text x="1123" y="196" class="head">3. 为什么会不一致</text>
  <text x="1105" y="240" class="body">FA 把 S2 切成 partial result</text>
  <text x="1105" y="278" class="body">FD 把多份 partial result 做最终规约</text>
  <text x="1105" y="322" class="code">(A + B) + C != A + (B + C)</text>
  <text x="1105" y="364" class="body">batch shape 改变分核顺序，就可能改变最后 bit</text>
  <text x="1105" y="405" class="small">level 3 要让每个 token 的切分只由自身有效 S2 决定</text>

  <rect x="135" y="485" width="1330" height="185" class="panel"/>
  <text x="168" y="526" class="head">4. pytest 中的两段式调用（level 3 必须包住两段）</text>
  <rect x="175" y="557" width="260" height="72" rx="14" fill="#f8d8c9" stroke="#c95537" stroke-width="2"/>
  <text x="208" y="586" class="body">set deterministic</text>
  <text x="274" y="614" class="code">level = 3</text>
  <path d="M440 593 H550" class="line"/>
  <rect x="555" y="557" width="310" height="72" rx="14" fill="#e8d8a9" stroke="#a87516" stroke-width="2"/>
  <text x="585" y="587" class="body">metadata op</text>
  <text x="585" y="614" class="small">shape + length + mask -> 1024 int32</text>
  <path d="M870 593 H980" class="line"/>
  <rect x="985" y="557" width="300" height="72" rx="14" fill="#cde5dc" stroke="#1f6655" stroke-width="2"/>
  <text x="1015" y="587" class="body">SMLA / MQSMLA main op</text>
  <text x="1015" y="614" class="small">同一 metadata 原样传入</text>
  <path d="M1290 593 H1380" class="line"/>
  <text x="1388" y="587" class="body">restore</text>
  <text x="1388" y="614" class="small">旧 level</text>
  <text x="175" y="652" class="small">pytest_v2：PT load -> 参数变换 -> 两段 NPU -> CPU golden -> MD5 + 原精度 -> metadata 白盒报告</text>

  <rect x="60" y="720" width="1480" height="205" class="panel"/>
  <text x="92" y="762" class="head">5. 四种黑盒模式：测试侧构造不同调用，算子侧只看到本次 shape</text>
  <rect x="92" y="790" width="330" height="105" rx="14" fill="#f8d8c9"/>
  <text x="112" y="821" class="code">1 reorder</text>
  <text x="112" y="852" class="body">batch 顺序变化</text>
  <text x="112" y="879" class="small">按 origin 还原后比较</text>
  <rect x="448" y="790" width="330" height="105" rx="14" fill="#f4e6bd"/>
  <text x="468" y="821" class="code">2 split</text>
  <text x="468" y="852" class="body">B=8 -> B=3 + B=5</text>
  <text x="468" y="879" class="small">显式 groups 在 pytest 参数层</text>
  <rect x="804" y="790" width="330" height="105" rx="14" fill="#d8e9e1"/>
  <text x="824" y="821" class="code">3 token-split</text>
  <text x="824" y="852" class="body">16K -> 4K + 12K</text>
  <text x="824" y="879" class="small">保持目标 token 的有效 KV 窗口</text>
  <rect x="1160" y="790" width="348" height="105" rx="14" fill="#d5e2ea"/>
  <text x="1180" y="821" class="code">4 shape-change</text>
  <text x="1180" y="852" class="body">300+100 vs 300+200</text>
  <text x="1180" y="879" class="small">只比较共同前 300，先过语义 oracle</text>

  <text x="70" y="958" class="small">红色：控制开关 ｜ 金色：任务规划 ｜ 绿色：实际计算 ｜ 白盒输出：FA/FD 核、token、S2 规约块和 workspace 对应关系</text>
</svg>
