<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <style>
      .title { font: 700 34px 'Noto Sans CJK SC', sans-serif; fill: #17241d; }
      .head { font: 700 21px 'Noto Sans CJK SC', sans-serif; fill: #17241d; }
      .body { font: 17px 'Noto Sans CJK SC', sans-serif; fill: #2a3930; }
      .line { stroke: #5c715f; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="1500" height="920" fill="#f7f4ea"/>
  <text x="55" y="60" class="title">字段关系思维导图：从一个 query token 向外看</text>
  <rect x="585" y="370" width="330" height="155" rx="70" fill="#efb875" stroke="#9b5d1f" stroke-width="3"/>
  <text x="647" y="425" class="head">query token (b, i)</text>
  <text x="638" y="462" class="body">内部有 N1 个 Q head</text>
  <text x="620" y="495" class="body">输出 shape 与 Q token 对齐</text>

  <path d="M585 415C480 330 420 250 345 205" class="line"/>
  <rect x="55" y="95" width="390" height="210" rx="22" fill="#dcebdc" stroke="#427450" stroke-width="2"/>
  <text x="85" y="138" class="head">批与序列：B / S1 / S2 / T</text>
  <text x="85" y="178" class="body">B：一次调用的序列组数</text>
  <text x="85" y="213" class="body">S1：每 batch 的 Q 物理/最大长度</text>
  <text x="85" y="248" class="body">S2：KV 物理/最大长度</text>
  <text x="85" y="283" class="body">T：TND 各 batch token 总和</text>

  <path d="M915 415C1020 330 1080 250 1155 205" class="line"/>
  <rect x="1055" y="95" width="390" height="210" rx="22" fill="#dce6f2" stroke="#3a638a" stroke-width="2"/>
  <text x="1085" y="138" class="head">Head 与向量：N1 / N2 / G / D</text>
  <text x="1085" y="178" class="body">N1：Q head 数</text>
  <text x="1085" y="213" class="body">N2：KV head 数</text>
  <text x="1085" y="248" class="body">G=N1/N2：共享一个 KV 的 Q heads</text>
  <text x="1085" y="283" class="body">D：每个 head 的向量宽度</text>

  <path d="M585 480C470 550 405 620 345 690" class="line"/>
  <rect x="55" y="620" width="430" height="230" rx="22" fill="#f2dfc5" stroke="#a46b2f" stroke-width="2"/>
  <text x="85" y="663" class="head">有效长度：seqused 与 cu_seqlens</text>
  <text x="85" y="703" class="body">seqused_q[b]：BSND/PA 常用有效 Q</text>
  <text x="85" y="738" class="body">seqused_*_kv[b]：有效 KV 右边界</text>
  <text x="85" y="773" class="body">cu_seqlens：[0, l0, l0+l1, ...]</text>
  <text x="85" y="808" class="body">长度必须 B+1，末项通常等于 T</text>

  <path d="M915 480C1030 550 1095 620 1155 690" class="line"/>
  <rect x="1015" y="620" width="430" height="230" rx="22" fill="#e2ddef" stroke="#655b8d" stroke-width="2"/>
  <text x="1045" y="663" class="head">三种 layout</text>
  <text x="1045" y="703" class="body">BSND：Q[B,S1,N1,D]</text>
  <text x="1045" y="738" class="body">TND：Q[T,N1,D] + prefix sum</text>
  <text x="1045" y="773" class="body">PA_BBND：KV[block,bs,N2,D]</text>
  <text x="1045" y="808" class="body">block_table 把逻辑序列映射到物理块</text>

  <path d="M750 370V270" class="line"/>
  <rect x="555" y="105" width="390" height="150" rx="22" fill="#f0cfbd" stroke="#9c4d2d" stroke-width="2"/>
  <text x="595" y="150" class="head">mask 决定“实际可见 S2”</text>
  <text x="595" y="190" class="body">threshold = K - Q + i + 1</text>
  <text x="595" y="225" class="body">visible ori + visible cmp → tiling负载</text>

  <path d="M750 525V625" class="line"/>
  <rect x="555" y="640" width="390" height="180" rx="22" fill="#d9e8e5" stroke="#39746e" stroke-width="2"/>
  <text x="590" y="683" class="head">metadata 索引关系</text>
  <text x="590" y="723" class="body">bn2 = b * N2 + n2</text>
  <text x="590" y="758" class="body">m_index → query position</text>
  <text x="590" y="793" class="body">m_start/m_num → token 内 G 行</text>
</svg>
