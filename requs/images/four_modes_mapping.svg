<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
  <defs>
    <style>
      .title { font: 700 34px 'Noto Sans CJK SC', sans-serif; fill: #17241d; }
      .head { font: 700 24px 'Noto Sans CJK SC', sans-serif; fill: #17241d; }
      .body { font: 17px 'Noto Sans CJK SC', sans-serif; fill: #2a3930; }
      .mono { font: 16px monospace; fill: #2a3930; }
      .arrow { stroke: #41584a; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#41584a"/></marker>
  </defs>
  <rect width="1500" height="940" fill="#f7f4ea"/>
  <text x="55" y="60" class="title">四种模式：改变的是调用边界，比较的是 TokenOrigin</text>

  <rect x="45" y="100" width="690" height="360" rx="24" fill="#dcebdc" stroke="#427450" stroke-width="2"/>
  <text x="80" y="145" class="head">1. reorder：同 B，batch 顺序改变</text>
  <text x="80" y="190" class="mono">baseline  [ b0 ][ b1 ][ b2 ]</text>
  <path d="M330 205V245" class="arrow"/>
  <text x="80" y="285" class="mono">derived   [ b2 ][ b0 ][ b1 ]</text>
  <text x="80" y="335" class="body">Q/KV/table/length/index 同步重排</text>
  <text x="80" y="375" class="body">输出按 origin 还原：b2→2，b0→0，b1→1</text>
  <text x="80" y="415" class="body">NPU 仍只看到一次 B=3 调用</text>

  <rect x="765" y="100" width="690" height="360" rx="24" fill="#f2dfc5" stroke="#a46b2f" stroke-width="2"/>
  <text x="800" y="145" class="head">2. split：一次 B=8 对两次 B=3/B=5</text>
  <text x="800" y="190" class="mono">baseline [0 1 2 3 4 5 6 7]</text>
  <path d="M1050 205V245" class="arrow"/>
  <text x="800" y="285" class="mono">call A   [0 1 2]</text>
  <text x="800" y="325" class="mono">call B   [3 4 5 6 7]</text>
  <text x="800" y="375" class="body">每个 subcase 直接和 baseline 对应 origin 比</text>
  <text x="800" y="415" class="body">这不是 kernel 的 FA/FD 分核</text>

  <rect x="45" y="500" width="690" height="390" rx="24" fill="#dce6f2" stroke="#3a638a" stroke-width="2"/>
  <text x="80" y="545" class="head">3. token-split：一个序列拆成连续完整分区</text>
  <text x="80" y="590" class="mono">baseline [ t0 ... t4095 | t4096 ... t16383 ]</text>
  <path d="M350 605V645" class="arrow"/>
  <text x="80" y="685" class="mono">call A   [ t0 ... t4095 ]</text>
  <text x="80" y="725" class="mono">call B   [ t4096 ... t16383 ]</text>
  <text x="80" y="775" class="body">区间连续、不重叠、总和=old Q</text>
  <text x="80" y="815" class="body">位置 mask 同步 KV，逐 token semantic oracle</text>
  <text x="80" y="855" class="body">每段独立失败，不能只看 merge</text>

  <rect x="765" y="500" width="690" height="390" rx="24" fill="#e2ddef" stroke="#655b8d" stroke-width="2"/>
  <text x="800" y="545" class="head">4. shape-change：shape 不同，共同前缀相同</text>
  <text x="800" y="590" class="mono">baseline [ common 300 ][ extra 100 ]</text>
  <path d="M1050 605V645" class="arrow"/>
  <text x="800" y="685" class="mono">derived  [ common 300 ][ extra 200 ]</text>
  <text x="800" y="735" class="body">只比较 common 300 的 origin</text>
  <text x="800" y="775" class="body">extra 200 不进入 MD5，也不冒充完整 golden</text>
  <text x="800" y="815" class="body">RightDown/Band：Q 与逻辑 KV 同步增长</text>
  <text x="800" y="855" class="body">PA 容量不足 → INVALID_TRANSFORM</text>
</svg>
