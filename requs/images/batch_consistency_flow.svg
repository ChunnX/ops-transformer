<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880">
  <defs>
    <style>
      .title { font: 700 34px 'Noto Sans CJK SC', sans-serif; fill: #15251d; }
      .head { font: 700 20px 'Noto Sans CJK SC', sans-serif; fill: #15251d; }
      .body { font: 17px 'Noto Sans CJK SC', sans-serif; fill: #26362d; }
      .small { font: 15px 'Noto Sans CJK SC', sans-serif; fill: #4c5b52; }
      .arrow { stroke: #335342; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#335342"/>
    </marker>
  </defs>
  <rect width="1500" height="880" fill="#f7f3e8"/>
  <text x="60" y="60" class="title">pytest_v2 batch consistency：原 golden 保留，比较关系新增</text>

  <rect x="55" y="105" width="300" height="105" rx="18" fill="#dcebdc" stroke="#3f7352" stroke-width="2"/>
  <text x="90" y="145" class="head">Excel baseline row</text>
  <text x="90" y="178" class="small">原字段 + 可选 pytest 配置列</text>
  <path d="M355 158H430" class="arrow"/>
  <rect x="435" y="105" width="300" height="105" rx="18" fill="#dcebdc" stroke="#3f7352" stroke-width="2"/>
  <text x="470" y="145" class="head">原 input normalization</text>
  <text x="470" y="178" class="small">dtype / default / length / table</text>
  <path d="M735 158H810" class="arrow"/>
  <rect x="815" y="105" width="280" height="105" rx="18" fill="#dcebdc" stroke="#3f7352" stroke-width="2"/>
  <text x="855" y="145" class="head">原 CPU golden</text>
  <text x="855" y="178" class="small">一次具体输入的数学预期</text>
  <path d="M1095 158H1170" class="arrow"/>
  <rect x="1175" y="105" width="270" height="105" rx="18" fill="#dcebdc" stroke="#3f7352" stroke-width="2"/>
  <text x="1215" y="145" class="head">原 baseline PT save</text>
  <text x="1215" y="178" class="small">schema 不增加 mode 参数</text>

  <path d="M1310 210V275H750" class="arrow"/>
  <rect x="555" y="280" width="390" height="105" rx="18" fill="#f4d9b8" stroke="#a76024" stroke-width="2"/>
  <text x="600" y="320" class="head">CaseAdapter + mode transform</text>
  <text x="600" y="353" class="small">构造 derived inputs + TokenOrigin</text>

  <path d="M555 333H410" class="arrow"/>
  <rect x="70" y="270" width="335" height="125" rx="18" fill="#fff8ed" stroke="#a76024" stroke-width="2"/>
  <text x="105" y="310" class="head">CPU-only prepare 路径</text>
  <text x="105" y="343" class="small">semantic oracle → mapped golden</text>
  <text x="105" y="370" class="small">derived PT save/reload → JSON</text>

  <path d="M750 385V450" class="arrow"/>
  <rect x="555" y="455" width="390" height="105" rx="18" fill="#f0cfbd" stroke="#9c4d2d" stroke-width="2"/>
  <text x="605" y="495" class="head">DeterministicLevelGuard(3)</text>
  <text x="605" y="528" class="small">每个 baseline / derived 调用都覆盖两段</text>

  <path d="M555 508H445" class="arrow"/>
  <rect x="80" y="445" width="360" height="125" rx="18" fill="#dce6f2" stroke="#355f8a" stroke-width="2"/>
  <text x="115" y="485" class="head">baseline：metadata → main op</text>
  <text x="115" y="518" class="small">保存 baseline NPU output/metadata</text>
  <text x="115" y="545" class="small">同一 PT 的原 CPU output 仍是精度门禁</text>

  <path d="M945 508H1060" class="arrow"/>
  <rect x="1065" y="445" width="360" height="125" rx="18" fill="#dce6f2" stroke="#355f8a" stroke-width="2"/>
  <text x="1100" y="485" class="head">derived：metadata → main op</text>
  <text x="1100" y="518" class="small">metadata 必须按 derived shape 重算</text>
  <text x="1100" y="545" class="small">不能复用 baseline metadata</text>

  <path d="M260 570V650H610" class="arrow"/>
  <path d="M1245 570V650H890" class="arrow"/>
  <rect x="535" y="655" width="430" height="125" rx="18" fill="#e1e0ef" stroke="#5b5687" stroke-width="2"/>
  <text x="580" y="695" class="head">三重门禁</text>
  <text x="580" y="728" class="body">origin 对齐 MD5 + CPU precision</text>
  <text x="580" y="758" class="body">+ metadata integrity / coverage</text>

  <path d="M750 780V830" class="arrow"/>
  <text x="485" y="858" class="head">PASS / FAIL / UNSUPPORTED / INVALID_TRANSFORM / NOT_APPLICABLE</text>
  <text x="1040" y="835" class="small">虚线外：CPU-only prepare 不产生 NPU PASS</text>
</svg>
