<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
    </marker>
  </defs>

  <!-- ==================== 标题 ==================== -->
  <text x="600" y="28" text-anchor="middle" font-size="16" font-weight="bold">Buffer 空间分配总览（L1 + UB）</text>
  <text x="600" y="46" text-anchor="middle" font-size="11" fill="#666">kL1=256, baseN=256, baseK=64, stepKb=4, xType=half</text>

  <!-- ==================== L1 区域（左侧） ==================== -->
  <text x="250" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">L1 Buffer（512KB）— Cube Core</text>

  <!-- 有 bias 布局 -->
  <text x="145" y="100" text-anchor="middle" font-size="12" font-weight="bold">有 Bias</text>

  <!-- WeightL1_P1 (128KB) -->
  <rect x="80" y="110" width="130" height="90" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="145" y="155" text-anchor="middle" font-size="10" font-weight="bold">WeightL1_P1</text>
  <text x="145" y="170" text-anchor="middle" font-size="9">128KB</text>
  <text x="145" y="183" text-anchor="middle" font-size="8" fill="#555">(65536 half)</text>

  <!-- Bias_P1 (4KB) -->
  <rect x="80" y="200" width="130" height="10" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="220" y="210" text-anchor="start" font-size="9" fill="#555">Bias_P1 4KB</text>

  <!-- AL1_P1 (124KB) -->
  <rect x="80" y="210" width="130" height="135" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="145" y="278" text-anchor="middle" font-size="11" font-weight="bold">AL1_P1</text>
  <text x="145" y="293" text-anchor="middle" font-size="9">124KB</text>
  <text x="145" y="306" text-anchor="middle" font-size="8" fill="#555">(63488 half)</text>

  <!-- AL1_P0 (124KB) -->
  <rect x="80" y="345" width="130" height="135" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5" opacity="0.75"/>
  <text x="145" y="413" text-anchor="middle" font-size="11" font-weight="bold">AL1_P0</text>
  <text x="145" y="428" text-anchor="middle" font-size="9">124KB</text>
  <text x="145" y="441" text-anchor="middle" font-size="8" fill="#555">(63488 half)</text>

  <!-- Bias_P0 (4KB) -->
  <rect x="80" y="480" width="130" height="10" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="220" y="490" text-anchor="start" font-size="9" fill="#555">Bias_P0 4KB</text>

  <!-- WeightL1_P0 (128KB) -->
  <rect x="80" y="490" width="130" height="90" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="145" y="535" text-anchor="middle" font-size="10" font-weight="bold">WeightL1_P0</text>
  <text x="145" y="550" text-anchor="middle" font-size="9">128KB</text>
  <text x="145" y="563" text-anchor="middle" font-size="8" fill="#555">(65536 half)</text>

  <!-- 有 bias 总计 -->
  <text x="145" y="596" text-anchor="middle" font-size="9" fill="#2e7d32">总计: 512KB，baseM=240 时 AL1 充足</text>

  <!-- 无 bias 布局 -->
  <text x="365" y="100" text-anchor="middle" font-size="12" font-weight="bold">无 Bias ✅</text>

  <!-- WeightL1_P1 (128KB) -->
  <rect x="300" y="110" width="130" height="90" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="365" y="155" text-anchor="middle" font-size="10" font-weight="bold">WeightL1_P1</text>
  <text x="365" y="170" text-anchor="middle" font-size="9">128KB</text>
  <text x="365" y="183" text-anchor="middle" font-size="8" fill="#555">(65536 half)</text>

  <!-- AL1_P1 (128KB) -->
  <rect x="300" y="200" width="130" height="145" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="365" y="273" text-anchor="middle" font-size="11" font-weight="bold">AL1_P1</text>
  <text x="365" y="288" text-anchor="middle" font-size="9">128KB</text>
  <text x="365" y="301" text-anchor="middle" font-size="8" fill="#555">(65536 half)</text>

  <!-- AL1_P0 (128KB) -->
  <rect x="300" y="345" width="130" height="145" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5" opacity="0.75"/>
  <text x="365" y="418" text-anchor="middle" font-size="11" font-weight="bold">AL1_P0</text>
  <text x="365" y="433" text-anchor="middle" font-size="9">128KB</text>
  <text x="365" y="446" text-anchor="middle" font-size="8" fill="#555">(65536 half)</text>

  <!-- WeightL1_P0 (128KB) -->
  <rect x="300" y="490" width="130" height="90" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="365" y="535" text-anchor="middle" font-size="10" font-weight="bold">WeightL1_P0</text>
  <text x="365" y="550" text-anchor="middle" font-size="9">128KB</text>
  <text x="365" y="563" text-anchor="middle" font-size="8" fill="#555">(65536 half)</text>

  <!-- 无 bias 总计 -->
  <text x="365" y="596" text-anchor="middle" font-size="9" fill="#2e7d32">总计: 512KB ✅</text>

  <!-- L1 双缓冲标注 -->
  <line x1="65" y1="110" x2="65" y2="345" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="60" y="230" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90, 60, 230)">P1（预取）</text>
  <line x1="65" y1="345" x2="65" y2="580" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="60" y="463" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90, 60, 463)">P0（计算）</text>

  <!-- ==================== UB 区域（右侧） ==================== -->
  <text x="750" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">UB Buffer（248KB 可用）— Vector Core</text>

  <!-- weightInputLowBit[1] (87KB) -->
  <rect x="680" y="110" width="140" height="140" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="750" y="175" text-anchor="middle" font-size="10" font-weight="bold">weightInputLowBit[3:2]</text>
  <text x="750" y="190" text-anchor="middle" font-size="9">2 x 43.5KB</text>
  <text x="750" y="203" text-anchor="middle" font-size="8" fill="#555">INT4 原始 weight</text>
  <text x="750" y="216" text-anchor="middle" font-size="8" fill="#555">(A16W4 实际每次不超过 16KB)</text>

  <!-- weightInputLowBit[0] (87KB) -->
  <rect x="680" y="250" width="140" height="140" fill="#90caf9" stroke="#1565c0" stroke-width="1.5" opacity="0.75"/>
  <text x="750" y="315" text-anchor="middle" font-size="10" font-weight="bold">weightInputLowBit[1:0]</text>
  <text x="750" y="330" text-anchor="middle" font-size="9">2 x 43.5KB</text>
  <text x="750" y="343" text-anchor="middle" font-size="8" fill="#555">INT4 原始 weight</text>
  <text x="750" y="356" text-anchor="middle" font-size="8" fill="#555">(A16W4 实际每次不超过 16KB)</text>

  <!-- highBitData[1] (33KB) -->
  <rect x="680" y="390" width="140" height="55" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="750" y="418" text-anchor="middle" font-size="10" font-weight="bold">highBitData[1]</text>
  <text x="750" y="433" text-anchor="middle" font-size="9">33KB（VF 输出 FP16，每次 32KB）</text>

  <!-- highBitData[0] (33KB) -->
  <rect x="680" y="445" width="140" height="55" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5" opacity="0.75"/>
  <text x="750" y="473" text-anchor="middle" font-size="10" font-weight="bold">highBitData[0]</text>
  <text x="750" y="488" text-anchor="middle" font-size="9">33KB（VF 输出 FP16，每次 32KB）</text>

  <!-- antiQuantScale[1] (2KB) -->
  <rect x="680" y="500" width="140" height="18" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="830" y="513" text-anchor="start" font-size="9" fill="#555">antiQuantScale[3:2] 2KB</text>

  <!-- antiQuantScale[0] (2KB) -->
  <rect x="680" y="518" width="140" height="18" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1.5" opacity="0.75"/>
  <text x="830" y="531" text-anchor="start" font-size="9" fill="#555">antiQuantScale[1:0] 2KB</text>

  <!-- antiQuantOffset[1] (2KB) - 保留空间，A16W4 pergroup 不使用 -->
  <rect x="680" y="536" width="140" height="18" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5" opacity="0.4"/>
  <text x="830" y="549" text-anchor="start" font-size="9" fill="#999">antiQuantOffset[3:2] 2KB (保留)</text>

  <!-- antiQuantOffset[0] (2KB) - 保留空间，A16W4 pergroup 不使用 -->
  <rect x="680" y="554" width="140" height="18" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5" opacity="0.3"/>
  <text x="830" y="567" text-anchor="start" font-size="9" fill="#999">antiQuantOffset[1:0] 2KB (保留)</text>

  <!-- UB 总计 -->
  <text x="750" y="590" text-anchor="middle" font-size="9" fill="#333">总计: 248KB（UB 可用空间，offset 保留但不使用）</text>

  <!-- UB 双缓冲标注 -->
  <line x1="665" y1="110" x2="665" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="660" y="250" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90, 660, 250)">四缓冲 [3:0]</text>

  <!-- ==================== 数据流箭头 ==================== -->

  <!-- GM → UB (MTE2) -->
  <line x1="950" y1="180" x2="825" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="960" y="175" text-anchor="start" font-size="10" font-weight="bold" fill="#1565c0">GM</text>
  <text x="960" y="190" text-anchor="start" font-size="9" fill="#1565c0">weight(INT4)</text>
  <text x="960" y="203" text-anchor="start" font-size="9" fill="#1565c0">scale</text>
  <text x="888" y="170" text-anchor="middle" font-size="9" fill="#1565c0">MTE2 ④</text>

  <!-- UB → UB (VF 反量化) -->
  <path d="M 825 350 C 870 350, 870 420, 825 420" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="880" y="380" text-anchor="start" font-size="9" font-weight="bold" fill="#2e7d32">VF ⑤</text>
  <text x="880" y="393" text-anchor="start" font-size="8" fill="#2e7d32">INT4 unpack</text>
  <text x="880" y="405" text-anchor="start" font-size="8" fill="#2e7d32">+反量化</text>

  <!-- UB → L1 (MTE3) -->
  <line x1="675" y1="470" x2="435" y2="470" stroke="#c62828" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="555" y="463" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">MTE3 ⑤</text>
  <text x="555" y="478" text-anchor="middle" font-size="8" fill="#c62828">W_dequant(FP16)</text>

  <!-- GM → L1 (MTE2) -->
  <line x1="30" y1="400" x2="75" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="25" y="385" text-anchor="end" font-size="10" font-weight="bold" fill="#333">GM</text>
  <text x="25" y="400" text-anchor="end" font-size="9" fill="#333">A 矩阵</text>
  <text x="25" y="413" text-anchor="end" font-size="9" fill="#333">Bias</text>
  <text x="52" y="393" text-anchor="middle" font-size="9" fill="#333">MTE2 ⑦</text>

  <!-- ==================== 底部：PerGroup 适配说明 ==================== -->
  <rect x="30" y="620" width="1140" height="380" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="600" y="645" text-anchor="middle" font-size="13" font-weight="bold">A16W4 PerGroup 适配要点（kL1=256）</text>

  <!-- 左侧：PerGroup antiQuantScale 分析 -->
  <text x="60" y="670" font-size="11" font-weight="bold" fill="#6a1b9a">▎PerGroup antiQuantScale 空间需求分析（按 VF tile 消费）</text>

  <!-- 表格 -->
  <rect x="60" y="680" width="520" height="20" fill="#e8eaf6" stroke="#9fa8da" stroke-width="0.5"/>
  <text x="70" y="694" font-size="9" font-weight="bold">groupSize</text>
  <text x="160" y="694" font-size="9" font-weight="bold">最大 G_tile</text>
  <text x="260" y="694" font-size="9" font-weight="bold">最大 N_tile</text>
  <text x="350" y="694" font-size="9" font-weight="bold">单次需求</text>
  <text x="450" y="694" font-size="9" font-weight="bold">单缓冲</text>
  <text x="550" y="694" font-size="9" font-weight="bold">结论</text>

  <rect x="60" y="700" width="520" height="18" fill="white" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="70" y="713" font-size="9">32</text>
  <text x="160" y="713" font-size="9">8</text>
  <text x="260" y="713" font-size="9">256</text>
  <text x="350" y="713" font-size="9">1KB</text>
  <text x="450" y="713" font-size="9">1KB</text>
  <text x="550" y="713" font-size="9" fill="#2e7d32">满足</text>

  <rect x="60" y="718" width="520" height="18" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="70" y="731" font-size="9">64</text>
  <text x="160" y="731" font-size="9">4</text>
  <text x="260" y="731" font-size="9">256</text>
  <text x="350" y="731" font-size="9">512B</text>
  <text x="450" y="731" font-size="9">1KB</text>
  <text x="550" y="731" font-size="9" fill="#2e7d32">满足</text>

  <rect x="60" y="736" width="520" height="18" fill="white" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="70" y="749" font-size="9">128</text>
  <text x="160" y="749" font-size="9">2</text>
  <text x="260" y="749" font-size="9">256</text>
  <text x="350" y="749" font-size="9">512B</text>
  <text x="450" y="749" font-size="9">1KB</text>
  <text x="550" y="749" font-size="9" fill="#2e7d32">✓</text>

  <rect x="60" y="754" width="520" height="18" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="70" y="767" font-size="9">256</text>
  <text x="160" y="767" font-size="9">1</text>
  <text x="260" y="767" font-size="9">256</text>
  <text x="350" y="767" font-size="9">512B</text>
  <text x="450" y="767" font-size="9">1KB</text>
  <text x="550" y="767" font-size="9" fill="#2e7d32">✓</text>

  <text x="60" y="792" font-size="10" fill="#333">结论：按 VF tile 搬运/消费 scale，gs=32 最大单次需求为 1KB。</text>
  <text x="60" y="806" font-size="10" fill="#2e7d32">A16W4 pergroup 复用 A16W8 ND UB 分配：scale 4KB，offset 4KB 保留但不使用。</text>

  <!-- 右侧：L1 空间分析 -->
  <text x="620" y="670" font-size="11" font-weight="bold" fill="#6a1b9a">▎L1 空间分析（kL1=256）</text>

  <rect x="620" y="685" width="530" height="130" fill="white" stroke="#9fa8da" stroke-width="1" rx="3"/>
  <text x="635" y="705" font-size="10" fill="#333">WeightL1 单缓冲 = nL1 × stepKb × baseK = 256 × 4 × 64 = 65536 half = 128KB</text>
  <text x="635" y="723" font-size="10" fill="#2e7d32">无 bias: WeightL1(128KB) × 2 + AL1(128KB) × 2 = 512KB</text>
  <text x="635" y="741" font-size="10" fill="#2e7d32">有 bias: WeightL1(128KB) × 2 + Bias(4KB) × 2 + AL1(124KB) × 2 = 512KB</text>
  <text x="635" y="759" font-size="10" fill="#2e7d32">有 bias 时 host tiling 使用 baseM=240，A tile 约 120KB，可放入 124KB AL1</text>
  <text x="635" y="777" font-size="10" fill="#555">L1 分配复用 A16W8 ND basic-controller 方案</text>
  <text x="635" y="795" font-size="10" fill="#333">结论：L1 空间闭合，不新增切分策略</text>

  <!-- 底部：Buffer 与基本块关系 -->
  <text x="60" y="840" font-size="11" font-weight="bold" fill="#333">▎Buffer 大小与基本块的关系</text>
  <text x="60" y="858" font-size="10" fill="#555">• WeightL1 单块 = nL1 × stepKb × baseK × sizeof(xType) = 256 × 4 × 64 × 2B = 128KB</text>
  <text x="60" y="874" font-size="10" fill="#555">• AL1 单块 = (L1 剩余空间) / 2，与 WeightL1 成反比（WeightL1 越大，AL1 越小）</text>
  <text x="60" y="890" font-size="10" fill="#555">• UB buffer 大小静态固定（不随 baseM/baseN/baseK 变化），tiling 需确保每次搬运量 ≤ buffer 容量</text>

  <!-- kL1=256 选择原因 -->
  <text x="60" y="920" font-size="11" font-weight="bold" fill="#333">▎kL1=256 选择原因</text>
  <text x="60" y="938" font-size="10" fill="#555">• kL1=256 保证在 gs=32/64/128/256 下，每个 tile 的 K 方向不跨越 group 边界</text>
  <text x="60" y="954" font-size="10" fill="#555">• gs=32→8 groups/tile, gs=64→4, gs=128→2, gs=256→1，均为整数，简化反量化代码</text>
  <text x="60" y="970" font-size="10" fill="#555">• kL1 = baseK × stepKb × depth = 64 × 4 = 256</text>

  <!-- ==================== 图例 ==================== -->
  <rect x="950" y="840" width="200" height="100" fill="white" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="1050" y="858" text-anchor="middle" font-size="10" font-weight="bold">图例</text>
  <rect x="965" y="865" width="16" height="12" fill="#90caf9" stroke="#1565c0" stroke-width="1"/>
  <text x="990" y="875" font-size="9">WeightL1 / weightInputLowBit</text>
  <rect x="965" y="882" width="16" height="12" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1"/>
  <text x="990" y="892" font-size="9">AL1 / highBitData</text>
  <rect x="965" y="899" width="16" height="12" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="990" y="909" font-size="9">BiasL1</text>
  <rect x="965" y="916" width="16" height="12" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1"/>
  <text x="990" y="926" font-size="9">antiQuantScale</text>
  <rect x="965" y="933" width="16" height="12" fill="#ef9a9a" stroke="#c62828" stroke-width="1" opacity="0.4"/>
  <text x="990" y="943" font-size="9">antiQuantOffset (保留)</text>
</svg>
