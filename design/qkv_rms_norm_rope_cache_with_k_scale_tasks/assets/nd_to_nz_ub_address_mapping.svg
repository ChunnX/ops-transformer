<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">ND二维逻辑矩阵到NZ四维物理布局</title>
  <desc id="desc">展示ND矩阵M乘N先把行列轴分别拆为M1M0和N1N0，再转置为NZ物理顺序N1M1M0N0；同时给出BF16下M0N0均为16、D128下N1为8，以及当前Kernel UB暂存的等价展平地址。</desc>
  <defs>
    <style>
      .h1 { font: 700 34px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#13213c; }
      .h2 { font: 700 22px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1c2e4c; }
      .body { font: 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#293952; }
      .small { font: 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#4b5c75; }
      .tiny { font: 13px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#52637b; }
      .mono { font: 16px "DejaVu Sans Mono",monospace; fill:#182740; }
      .mono2 { font: 14px "DejaVu Sans Mono",monospace; fill:#273a57; }
      .panel { fill:#fff; stroke:#aab8cc; stroke-width:2; rx:16; }
      .cell { font: 700 14px "DejaVu Sans Mono",monospace; text-anchor:middle; dominant-baseline:middle; fill:#173052; }
      .arrowtxt { font:700 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#08747b; text-anchor:middle; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#08747b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#356db4"/>
    </marker>
    <marker id="orange-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#d56b27"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="#f5f7fb"/>
  <text x="800" y="54" class="h1" text-anchor="middle">ND逻辑二维矩阵 → NZ物理四维布局</text>
  <text x="800" y="88" class="body" text-anchor="middle">ND本身仍是 [M,N]；四维来自NZ对行轴和列轴的分形拆分</text>

  <rect x="90" y="112" width="1420" height="64" rx="12" fill="#e8eef8" stroke="#afbdd2"/>
  <text x="800" y="139" class="mono" text-anchor="middle">Shape表达：((_16{}, ShapeRow1), (_32{} / sizeof(T), ShapeColumn1))</text>
  <text x="800" y="163" class="small" text-anchor="middle">含义：M = M1×M0，N = N1×N0；M0=16，N0=32B/sizeof(T)。BF16下N0=16。</text>

  <!-- ND panel -->
  <rect x="55" y="205" width="430" height="490" class="panel"/>
  <text x="270" y="242" class="h2" text-anchor="middle">① ND：逻辑二维 [M,N]</text>
  <text x="270" y="270" class="mono2" text-anchor="middle">坐标：(row, d)</text>

  <text x="92" y="323" class="mono2">row 0</text>
  <text x="92" y="383" class="mono2">row 1</text>
  <text x="92" y="443" class="mono2">row 2</text>
  <text x="92" y="503" class="mono2">row 3</text>

  <g transform="translate(160 295)">
    <rect x="0" y="0" width="68" height="42" rx="5" fill="#d2e6ff" stroke="#6093d0"/><text x="34" y="22" class="cell">B0</text>
    <rect x="72" y="0" width="68" height="42" rx="5" fill="#daebff" stroke="#6093d0"/><text x="106" y="22" class="cell">B1</text>
    <rect x="144" y="0" width="68" height="42" rx="5" fill="#ffe1c9" stroke="#d78146"/><text x="178" y="22" class="cell">…</text>
    <rect x="216" y="0" width="68" height="42" rx="5" fill="#ffeadb" stroke="#d78146"/><text x="250" y="22" class="cell">B7</text>
  </g>
  <g transform="translate(160 355)">
    <rect x="0" y="0" width="68" height="42" rx="5" fill="#d2e6ff" stroke="#6093d0"/><text x="34" y="22" class="cell">B0</text>
    <rect x="72" y="0" width="68" height="42" rx="5" fill="#daebff" stroke="#6093d0"/><text x="106" y="22" class="cell">B1</text>
    <rect x="144" y="0" width="68" height="42" rx="5" fill="#ffe1c9" stroke="#d78146"/><text x="178" y="22" class="cell">…</text>
    <rect x="216" y="0" width="68" height="42" rx="5" fill="#ffeadb" stroke="#d78146"/><text x="250" y="22" class="cell">B7</text>
  </g>
  <g transform="translate(160 415)">
    <rect x="0" y="0" width="68" height="42" rx="5" fill="#d2e6ff" stroke="#6093d0"/><text x="34" y="22" class="cell">B0</text>
    <rect x="72" y="0" width="68" height="42" rx="5" fill="#daebff" stroke="#6093d0"/><text x="106" y="22" class="cell">B1</text>
    <rect x="144" y="0" width="68" height="42" rx="5" fill="#ffe1c9" stroke="#d78146"/><text x="178" y="22" class="cell">…</text>
    <rect x="216" y="0" width="68" height="42" rx="5" fill="#ffeadb" stroke="#d78146"/><text x="250" y="22" class="cell">B7</text>
  </g>
  <g transform="translate(160 475)">
    <rect x="0" y="0" width="68" height="42" rx="5" fill="#d2e6ff" stroke="#6093d0"/><text x="34" y="22" class="cell">B0</text>
    <rect x="72" y="0" width="68" height="42" rx="5" fill="#daebff" stroke="#6093d0"/><text x="106" y="22" class="cell">B1</text>
    <rect x="144" y="0" width="68" height="42" rx="5" fill="#ffe1c9" stroke="#d78146"/><text x="178" y="22" class="cell">…</text>
    <rect x="216" y="0" width="68" height="42" rx="5" fill="#ffeadb" stroke="#d78146"/><text x="250" y="22" class="cell">B7</text>
  </g>
  <text x="270" y="555" class="small" text-anchor="middle">每个 Bk 是N轴连续的N0个元素</text>
  <text x="270" y="581" class="small" text-anchor="middle">BF16：N0=16；D=128时N1=8</text>
  <rect x="90" y="610" width="360" height="58" rx="9" fill="#f1f4f9" stroke="#c0cada"/>
  <text x="270" y="646" class="mono" text-anchor="middle">addrND = row × N + d</text>

  <!-- arrow 1 -->
  <path d="M500 430 L565 430" stroke="#08747b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="532" y="406" class="arrowtxt">拆轴</text>

  <!-- factor panel -->
  <rect x="580" y="205" width="440" height="490" class="panel"/>
  <text x="800" y="242" class="h2" text-anchor="middle">② 行列轴各拆成两级</text>
  <text x="800" y="276" class="mono" text-anchor="middle">row = m1 × M0 + m0</text>
  <text x="800" y="306" class="mono" text-anchor="middle">d   = n1 × N0 + n0</text>

  <rect x="625" y="340" width="350" height="72" rx="12" fill="#e2efff" stroke="#6093d0" stroke-width="2"/>
  <text x="800" y="370" class="body" text-anchor="middle">行轴 M → (M1, M0)</text>
  <text x="800" y="397" class="mono2" text-anchor="middle">M0 = 16，M1 = ceil(M / 16)</text>

  <rect x="625" y="435" width="350" height="72" rx="12" fill="#ffead9" stroke="#d78146" stroke-width="2"/>
  <text x="800" y="465" class="body" text-anchor="middle">列轴 N → (N1, N0)</text>
  <text x="800" y="492" class="mono2" text-anchor="middle">N0 = 32B / sizeof(T)</text>

  <text x="800" y="547" class="small" text-anchor="middle">对BF16：M0=16，N0=16</text>
  <rect x="625" y="574" width="350" height="78" rx="10" fill="#f1f4f9" stroke="#b9c4d4"/>
  <text x="800" y="605" class="body" text-anchor="middle">reshape后的四维坐标</text>
  <text x="800" y="634" class="mono" text-anchor="middle">[M1, M0, N1, N0]</text>

  <!-- arrow 2 -->
  <path d="M1035 430 L1095 430" stroke="#08747b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1065" y="406" class="arrowtxt">转置</text>

  <!-- NZ panel -->
  <rect x="1110" y="205" width="435" height="490" class="panel"/>
  <text x="1327" y="242" class="h2" text-anchor="middle">③ NZ：物理四维</text>
  <text x="1327" y="272" class="mono" text-anchor="middle">[N1, M1, M0, N0]</text>

  <rect x="1150" y="306" width="355" height="100" rx="12" fill="#d2e6ff" stroke="#6093d0" stroke-width="2"/>
  <text x="1180" y="333" class="mono2">N1=0（B0）</text>
  <rect x="1180" y="346" width="135" height="44" rx="6" fill="#fff" stroke="#7d94b5"/>
  <text x="1247" y="369" class="cell">M1=0</text>
  <text x="1398" y="365" class="small" text-anchor="middle">内部fractal</text>
  <text x="1398" y="386" class="mono2" text-anchor="middle">[M0=16,N0=16]</text>

  <rect x="1150" y="422" width="355" height="100" rx="12" fill="#daebff" stroke="#6093d0" stroke-width="2"/>
  <text x="1180" y="449" class="mono2">N1=1（B1）</text>
  <rect x="1180" y="462" width="135" height="44" rx="6" fill="#fff" stroke="#7d94b5"/>
  <text x="1247" y="485" class="cell">M1=0</text>
  <text x="1398" y="481" class="small" text-anchor="middle">内部fractal</text>
  <text x="1398" y="502" class="mono2" text-anchor="middle">[16,16]</text>

  <text x="1327" y="555" class="body" text-anchor="middle">⋮</text>
  <rect x="1150" y="574" width="355" height="64" rx="12" fill="#ffeadb" stroke="#d78146" stroke-width="2"/>
  <text x="1180" y="613" class="mono2">N1=7（B7）</text>
  <text x="1398" y="613" class="mono2" text-anchor="middle">[M1,M0,N0]</text>
  <text x="1327" y="669" class="small" text-anchor="middle">先遍历N1块，再遍历M1/M0行，最后遍历N0</text>

  <!-- bottom address formulas -->
  <rect x="55" y="735" width="1490" height="285" class="panel"/>
  <text x="800" y="773" class="h2" text-anchor="middle">四维NZ地址与当前Kernel UB暂存地址的对应</text>

  <rect x="90" y="805" width="690" height="105" rx="12" fill="#edf3fb" stroke="#aebed4"/>
  <text x="435" y="836" class="body" text-anchor="middle">标准四维坐标</text>
  <text x="435" y="867" class="mono" text-anchor="middle">n1=d/N0, n0=d%N0, m1=row/16, m0=row%16</text>
  <text x="435" y="895" class="mono2" text-anchor="middle">addrNZ = (((n1×M1+m1)×16+m0)×N0)+n0</text>

  <rect x="820" y="805" width="690" height="105" rx="12" fill="#f8f1ea" stroke="#d0b18f"/>
  <text x="1165" y="836" class="body" text-anchor="middle">当前UB暂存把(m1,m0)展平为row</text>
  <text x="1165" y="867" class="mono" text-anchor="middle">row = m1×16+m0，S = rowStride</text>
  <text x="1165" y="895" class="mono2" text-anchor="middle">addrUB = ((n1×S+row)×16)+n0</text>

  <rect x="90" y="935" width="315" height="58" rx="10" fill="#e2efff" stroke="#6093d0"/>
  <text x="247" y="960" class="body" text-anchor="middle">outLow：d=0…63</text>
  <text x="247" y="982" class="mono2" text-anchor="middle">n1 = 0…3</text>
  <path d="M415 964 L525 964" stroke="#356db4" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="470" y="945" class="tiny" text-anchor="middle">Scatter</text>
  <rect x="535" y="935" width="315" height="58" rx="10" fill="#e9f3ff" stroke="#6093d0"/>
  <text x="692" y="970" class="body" text-anchor="middle">写入NZ的B0…B3</text>

  <rect x="900" y="935" width="315" height="58" rx="10" fill="#ffead9" stroke="#d78146"/>
  <text x="1057" y="960" class="body" text-anchor="middle">outHigh：d=64…127</text>
  <text x="1057" y="982" class="mono2" text-anchor="middle">n1 = 4…7</text>
  <path d="M1225 964 L1335 964" stroke="#d56b27" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="1280" y="945" class="tiny" text-anchor="middle">+halfDOffset</text>
  <rect x="1345" y="935" width="165" height="58" rx="10" fill="#fff0e4" stroke="#d78146"/>
  <text x="1427" y="970" class="body" text-anchor="middle">B4…B7</text>

  <text x="800" y="1055" class="small" text-anchor="middle">结论：图中的三维 [N1,row,N0] 只是将四维 [N1,M1,M0,N0] 的 M1/M0 展平后的地址视图。</text>
</svg>
