<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 白色画布背景：保证在浅色/深色主题下都可读 -->
  <rect x="0" y="0" width="1180" height="720" fill="#ffffff"/>
  <!-- ===================== 标题 / 口径 ===================== -->
  <text x="590" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">MegaMoe A8W4 wave 流水模拟（2 专家 = 1 wave，单核代表视图）</text>
  <text x="40" y="52" font-size="12" fill="#4b5563">缩写：G1=GMM1  G2=GMM2  D=dispatch  S=swiglu  C=combine  P/Q=G1/G2 prologue ｜ 每 wave 2 专家：G1(e0)G1(e1)G2(e0)G2(e1) ｜ 数值均为单专家（us）</text>

  <!-- ===================== 图例 ===================== -->
  <g font-size="11.5" fill="#374151">
    <rect x="40" y="64" width="18" height="14" fill="#1d4ed8" rx="3"/>
    <text x="64" y="76">AIC·GMM1</text>
    <rect x="150" y="64" width="18" height="14" fill="#0891b2" rx="3"/>
    <text x="174" y="76">AIC·GMM2</text>
    <rect x="270" y="64" width="18" height="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="3"/>
    <text x="294" y="76">AIV0·prologue（P/Q）</text>
    <rect x="470" y="64" width="18" height="14" fill="#f59e0b" rx="3"/>
    <text x="494" y="76">AIV1·dispatch</text>
    <rect x="610" y="64" width="18" height="14" fill="#10b981" rx="3"/>
    <text x="634" y="76">AIV1·swiglu</text>
    <rect x="740" y="64" width="18" height="14" fill="#8b5cf6" rx="3"/>
    <text x="764" y="76">AIV1·combine</text>
  </g>

  <!-- ===================== wave 边界 ===================== -->
  <text x="160" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">wave 0（专家0/1）</text>
  <text x="604" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">wave 1（专家2/3）</text>
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
    <line x1="160" y1="124" x2="160" y2="292"/>
    <line x1="604" y1="124" x2="604" y2="292"/>
  </g>

  <!-- 算子整体起止标记 -->
  <line x1="100" y1="124" x2="100" y2="292" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">开始 t=0</text>
  <line x1="1116" y1="124" x2="1116" y2="292" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1116" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">结束 t=508</text>

  <!-- ===== AIC lane：G1(e0)G1(e1)G2(e0)G2(e1)，无等 S 空泡 ===== -->
  <rect x="100" y="124" width="1016" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="151" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIC</text>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <rect x="160" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="233" y="150">G1(0) 73</text>
    <rect x="306" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="379" y="150">G1(1) 73</text>
    <rect x="452" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="490" y="150">G2(0) 38</text>
    <rect x="528" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="566" y="150">G2(1) 38</text>
    <rect x="604" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="677" y="150">G1(2) 73</text>
    <rect x="750" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="823" y="150">G1(3) 73</text>
    <rect x="896" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="934" y="150">G2(2) 38</text>
    <rect x="972" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="1010" y="150">G2(3) 38</text>
  </g>
  <!-- S 隐藏标注：G1(e1) 运行期间 S(e0) 已完成 -->
  <text x="382" y="122" text-anchor="middle" font-size="9.5" fill="#059669" font-weight="bold">S0 藏在 G1(1)</text>
  <text x="762" y="122" text-anchor="middle" font-size="9.5" fill="#059669" font-weight="bold">S2 藏在 G1(3)</text>

  <!-- ===== AIV0 lane（P/Q prologue：尽可能早启动、比对应 GMM 早结束 2~5us） ===== -->
  <rect x="100" y="184" width="1016" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="211" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIV0</text>
  <g font-size="11" fill="#134e4a" text-anchor="middle" font-weight="bold">
    <rect x="100" y="190" width="198" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="199" y="210">P0</text>
    <rect x="298" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="371" y="210">P1</text>
    <rect x="444" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="482" y="210">Q0</text>
    <rect x="520" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="558" y="210">Q1</text>
    <rect x="596" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="669" y="210">P2</text>
    <rect x="742" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="815" y="210">P3</text>
    <rect x="888" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="926" y="210">Q2</text>
    <rect x="964" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="1002" y="210">Q3</text>
  </g>

  <!-- ===== AIV1 lane（D 预取 → S → C，C 与下一 G1 重叠） ===== -->
  <rect x="100" y="248" width="1016" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="275" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIV1</text>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <rect x="100" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="130" y="274" fill="#1f2937">D(0)</text>
    <rect x="160" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="190" y="274" fill="#1f2937">D(1)</text>
    <rect x="306" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="318" y="274" fill="#064e3b">S0</text>
    <rect x="330" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="360" y="274" fill="#1f2937">D(2)</text>
    <rect x="452" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="464" y="274" fill="#064e3b">S1</text>
    <rect x="480" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="528" y="274">C(0) 48</text>
    <rect x="576" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="624" y="274">C(1) 48</text>
    <rect x="672" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="702" y="274" fill="#1f2937">D(3)</text>
    <rect x="750" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="762" y="274" fill="#064e3b">S2</text>
    <rect x="896" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="908" y="274" fill="#064e3b">S3</text>
    <rect x="924" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="972" y="274">C(2) 48</text>
    <rect x="1020" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="1068" y="274">C(3) 48</text>
  </g>

  <!-- ===== 时间轴（连续，1us=2px） ===== -->
  <line x1="100" y1="308" x2="1116" y2="308" stroke="#9ca3af" stroke-width="1"/>
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <line x1="100"  y1="304" x2="100"  y2="312" stroke="#9ca3af"/>
    <text x="100"  y="324">0</text>
    <line x1="300" y1="304" x2="300" y2="312" stroke="#9ca3af"/>
    <text x="300" y="324">100</text>
    <line x1="500" y1="304" x2="500" y2="312" stroke="#9ca3af"/>
    <text x="500" y="324">200</text>
    <line x1="700" y1="304" x2="700" y2="312" stroke="#9ca3af"/>
    <text x="700" y="324">300</text>
    <line x1="900" y1="304" x2="900" y2="312" stroke="#9ca3af"/>
    <text x="900" y="324">400</text>
    <line x1="1100" y1="304" x2="1100" y2="312" stroke="#9ca3af"/>
    <text x="1100" y="324">500</text>
    <line x1="1116" y1="304" x2="1116" y2="312" stroke="#9ca3af"/>
    <text x="1116" y="324">508</text>
  </g>
  <text x="100" y="348" font-size="10.5" fill="#6b7280">时间轴（us，1us＝2px）；wave 边界取 wave 首 G1 起点；D(e) 提前预取；combine 在 G2 启动后 14us 即可开始（tile 级）</text>

  <!-- ===================== 算子总时长 ===================== -->
  <text x="590" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">算子总时长 ≈ 508us（t=0：D(0)/P(0) 启动 → t=508：C(3) 完成）</text>

  <!-- ===================== 关键发现 ===================== -->
  <text x="40" y="398" font-size="12.5" fill="#059669" font-weight="bold">✅ 2 专家/wave：AIC 无空泡，连续 111us/专家（G1 73 + G2 38，无“等 S”）</text>
  <text x="60" y="418" font-size="12" fill="#374151">· S(e) 在 AIV1 上完成时，AIC 正在跑同 wave 后一个专家的 G1（12us &lt; 73us），G2(e) 直接接上，空泡消失</text>
  <text x="60" y="436" font-size="12" fill="#374151">· 4 专家 wall ≈ 508us &lt; 当前分阶段 528us &lt; wave-1（546us）——2 专家/wave 是最优形态</text>

  <!-- ===================== 结论 ===================== -->
  <rect x="40" y="458" width="1100" height="252" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="60" y="484" font-size="14" font-weight="bold" fill="#111827">结论（wave-2 vs 现状 vs wave-1）</text>

  <text x="60" y="512" font-size="12.5" fill="#1e40af" font-weight="bold">收益</text>
  <text x="80" y="532" font-size="12" fill="#374151">· S 空泡被同 wave 的 G1(e+1) 掩盖（wave-1 的 12us×4 空泡消失）；AIC 连续 111us/专家</text>
  <text x="80" y="550" font-size="12" fill="#374151">· 首 wave 的 G2 大幅提前（G2(0) 176us 起 vs 分阶段 322us）→ combine 前移、整体提前</text>
  <text x="80" y="568" font-size="12" fill="#374151">· 总时长 508us：比现状省 ~20us（4%）、比 wave-1 省 ~38us（7%）</text>

  <text x="60" y="596" font-size="12.5" fill="#dc2626" font-weight="bold">注意</text>
  <text x="80" y="616" font-size="12" fill="#374151">· 首 wave 的 G2(e) 要等同 wave 后一个专家的 G1 完成（换取 S 隐藏），早专家 G2/combine 略延后</text>
  <text x="80" y="634" font-size="12" fill="#374151">· AIV0 的 P+Q = 111us/专家，已与 AIC 持平——wave 再放大要留意 AIV0 是否变成新瓶颈</text>

  <text x="60" y="662" font-size="12.5" fill="#0d9488" font-weight="bold">建议</text>
  <text x="80" y="682" font-size="12" fill="#374151">· 2 专家/wave 是优于现状与 1 专家/wave 的形态，可作为 A8W4 wave 改造的目标粒度</text>

  <text x="60" y="706" font-size="10.5" fill="#6b7280">注：模拟基于实测单专家时长（D30 / G1 73 / S12 / G2 38 / C48，P/Q 与对应 GMM 重叠）；wave 内顺序参考 A8W8 MegaMoeWave（AIC：G1(B)→G2(B)→G1(B+1)）；combine 按 tile 级（G2 启动后 14us 可开始）；单核代表视图，实际按 tile 分布到各核。</text>
</svg>
