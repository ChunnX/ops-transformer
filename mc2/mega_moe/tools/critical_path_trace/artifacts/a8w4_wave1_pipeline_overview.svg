<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="730" viewBox="0 0 1300 730" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 白色画布背景：保证在浅色/深色主题下都可读 -->
  <rect x="0" y="0" width="1300" height="730" fill="#ffffff"/>
  <!-- ===================== 标题 / 口径 ===================== -->
  <text x="650" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">MegaMoe A8W4 wave 流水模拟（1 专家 = 1 wave，单核代表视图）</text>
  <text x="40" y="52" font-size="12" fill="#4b5563">缩写：G1=GMM1  G2=GMM2  D=dispatch  S=swiglu  C=combine  P/Q=G1/G2 prologue ｜ 循环：D→G1→S→G2→C（每 wave 一个专家） ｜ 数值均为单专家（us）</text>

  <!-- ===================== 图例 ===================== -->
  <g font-size="11.5" fill="#374151">
    <rect x="40" y="64" width="18" height="14" fill="#1d4ed8" rx="3"/>
    <text x="64" y="76">AIC·GMM1</text>
    <rect x="150" y="64" width="18" height="14" fill="#0891b2" rx="3"/>
    <text x="174" y="76">AIC·GMM2</text>
    <rect x="270" y="64" width="18" height="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="3"/>
    <text x="294" y="76">AIV0·prologue（P/Q）</text>
    <rect x="470" y="64" width="18" height="14" fill="#f59e0b" rx="3"/>
    <text x="494" y="76">AIV1·dispatch</text>
    <rect x="610" y="64" width="18" height="14" fill="#10b981" rx="3"/>
    <text x="634" y="76">AIV1·swiglu</text>
    <rect x="740" y="64" width="18" height="14" fill="#8b5cf6" rx="3"/>
    <text x="764" y="76">AIV1·combine</text>
    <rect x="880" y="64" width="18" height="14" fill="#e5e7eb" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <text x="904" y="76">AIC 空泡（等 S）</text>
  </g>

  <!-- ===================== wave 边界 ===================== -->
  <text x="160" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">wave 0</text>
  <text x="406" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">wave 1</text>
  <text x="652" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">wave 2</text>
  <text x="898" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">wave 3</text>
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
    <line x1="160" y1="124" x2="160" y2="292"/>
    <line x1="406" y1="124" x2="406" y2="292"/>
    <line x1="652" y1="124" x2="652" y2="292"/>
    <line x1="898" y1="124" x2="898" y2="292"/>
  </g>

  <!-- 算子整体起止标记 -->
  <line x1="100" y1="124" x2="100" y2="292" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">开始 t=0</text>
  <line x1="1192" y1="124" x2="1192" y2="292" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1192" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">结束 t=546</text>

  <!-- ===== AIC lane（G1(e) → 等S → G2(e) → G1(e+1)） ===== -->
  <rect x="100" y="124" width="1092" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="151" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIC</text>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <rect x="160" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="233" y="150">G1(0) 73</text>
    <rect x="330" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="368" y="150">G2(0) 38</text>
    <rect x="406" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="479" y="150">G1(1) 73</text>
    <rect x="576" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="614" y="150">G2(1) 38</text>
    <rect x="652" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="725" y="150">G1(2) 73</text>
    <rect x="822" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="860" y="150">G2(2) 38</text>
    <rect x="898" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="971" y="150">G1(3) 73</text>
    <rect x="1068" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="1106" y="150">G2(3) 38</text>
  </g>
  <!-- AIC 等 S 空泡（12us） -->
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <rect x="306" y="130" width="24" height="32" fill="#e5e7eb" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="318" y="149">12</text>
    <rect x="552" y="130" width="24" height="32" fill="#e5e7eb" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="564" y="149">12</text>
    <rect x="798" y="130" width="24" height="32" fill="#e5e7eb" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="810" y="149">12</text>
    <rect x="1044" y="130" width="24" height="32" fill="#e5e7eb" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="1056" y="149">12</text>
  </g>

  <!-- ===== AIV0 lane（P/Q prologue，与对应 GMM 重叠） ===== -->
  <rect x="100" y="184" width="1092" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="211" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIV0</text>
  <g font-size="11" fill="#134e4a" text-anchor="middle" font-weight="bold">
    <rect x="100" y="190" width="198" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="199" y="210">P0</text>
    <rect x="298" y="190" width="100" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="348" y="210">Q0</text>
    <rect x="398" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="471" y="210">P1</text>
    <rect x="544" y="190" width="100" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="594" y="210">Q1</text>
    <rect x="644" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="717" y="210">P2</text>
    <rect x="790" y="190" width="100" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="840" y="210">Q2</text>
    <rect x="890" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="963" y="210">P3</text>
    <rect x="1036" y="190" width="100" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="1086" y="210">Q3</text>
  </g>

  <!-- ===== AIV1 lane（D 预取 → S → C；C 与 G2 重叠，tile 级） ===== -->
  <rect x="100" y="248" width="1092" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="275" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIV1</text>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <rect x="100" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="130" y="274" fill="#1f2937">D(0)</text>
    <rect x="160" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="190" y="274" fill="#1f2937">D(1)</text>
    <rect x="306" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="318" y="274" fill="#064e3b">S0</text>
    <rect x="358" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="406" y="274">C(0) 48</text>
    <rect x="454" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="484" y="274" fill="#1f2937">D(2)</text>
    <rect x="552" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="564" y="274" fill="#064e3b">S1</text>
    <rect x="604" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="652" y="274">C(1) 48</text>
    <rect x="700" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="730" y="274" fill="#1f2937">D(3)</text>
    <rect x="798" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="810" y="274" fill="#064e3b">S2</text>
    <rect x="850" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="898" y="274">C(2) 48</text>
    <rect x="1044" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="1056" y="274" fill="#064e3b">S3</text>
    <rect x="1096" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="1144" y="274">C(3) 48</text>
  </g>

  <!-- combine 与 G2 重叠标注（tile 级：G2 启动后 14us 首 tile 就绪） -->
  <line x1="330" y1="162" x2="358" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="368" y="240" font-size="10.5" fill="#dc2626">C 与 G2 重叠（晚启 14us）</text>

  <!-- ===== 时间轴（连续，1us=2px） ===== -->
  <line x1="100" y1="308" x2="1192" y2="308" stroke="#9ca3af" stroke-width="1"/>
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <line x1="100"  y1="304" x2="100"  y2="312" stroke="#9ca3af"/>
    <text x="100"  y="324">0</text>
    <line x1="300" y1="304" x2="300" y2="312" stroke="#9ca3af"/>
    <text x="300" y="324">100</text>
    <line x1="500" y1="304" x2="500" y2="312" stroke="#9ca3af"/>
    <text x="500" y="324">200</text>
    <line x1="700" y1="304" x2="700" y2="312" stroke="#9ca3af"/>
    <text x="700" y="324">300</text>
    <line x1="900" y1="304" x2="900" y2="312" stroke="#9ca3af"/>
    <text x="900" y="324">400</text>
    <line x1="1100" y1="304" x2="1100" y2="312" stroke="#9ca3af"/>
    <text x="1100" y="324">500</text>
    <line x1="1192" y1="304" x2="1192" y2="312" stroke="#9ca3af"/>
    <text x="1192" y="324">546</text>
  </g>
  <text x="100" y="348" font-size="10.5" fill="#6b7280">时间轴（us，1us＝2px）；wave 边界取 G1(e) 起点；D(e+1) 提前预取；combine 与 G2 重叠（tile 级，G2 起 14us 后）</text>

  <!-- ===================== 算子总时长 ===================== -->
  <text x="670" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">算子总时长 ≈ 546us（t=0：D(0)/P(0) 启动 → t=546：C(3) 完成）</text>

  <!-- ===================== 关键发现 ===================== -->
  <text x="40" y="398" font-size="12.5" fill="#dc2626" font-weight="bold">⚠ 1 专家/wave 的核心问题：AIC 每专家多出 12us 的“等 S(e)”空泡</text>
  <text x="60" y="418" font-size="12" fill="#374151">· G2(e) 依赖 S(e)（swiglu 12us），而 wave 内只有 1 个专家，S(e) 没有同 wave 的其他 G1 可藏 → AIC 周期 = 73 + 12 + 38 = 123us/专家</text>
  <text x="60" y="436" font-size="12" fill="#374151">· 4 专家 wall ≈ 546us（C(3) 结束）&gt; 当前分阶段 ≈ 528us——分阶段把 S 藏在 G1(e+1) 后面，AIC 无此空泡（combine 与 G2 重叠，tile 级）</text>

  <!-- ===================== 结论 ===================== -->
  <rect x="40" y="458" width="1220" height="252" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="60" y="484" font-size="14" font-weight="bold" fill="#111827">结论（wave 模拟 vs 现状）</text>

  <text x="60" y="512" font-size="12.5" fill="#1e40af" font-weight="bold">收益</text>
  <text x="80" y="532" font-size="12" fill="#374151">· 消除 Phase1/Phase2 分阶段：AIC 的 G1(e+1) 与 AIV1 的 C(e) 重叠（红箭头=等 S 空泡除外），流水连续</text>
  <text x="80" y="550" font-size="12" fill="#374151">· AIV1 有富余（90us/专家 &lt; 123us）：dispatch 提前预取 + combine 与下一 G1 重叠，不成为瓶颈</text>
  <text x="80" y="568" font-size="12" fill="#374151">· AIV0 有富余（111us/专家 &lt; 123us）：P/Q prologue 始终掩盖在对应 GMM 下，不在关键路径</text>

  <text x="60" y="596" font-size="12.5" fill="#dc2626" font-weight="bold">代价</text>
  <text x="80" y="616" font-size="12" fill="#374151">· G1(e)→G2(e) 之间插入 12us S-handoff 空泡（4 专家共 48us）；AIC 周期 123us 比分阶段 G1 的 73us/专家还高</text>

  <text x="60" y="644" font-size="12.5" fill="#0d9488" font-weight="bold">建议</text>
  <text x="80" y="664" font-size="12" fill="#374151">· wave 内放 ≥2 个专家（expertsPerWave &gt; 1）：让 S(e) 与同 wave 的 G1(e+1..) 重叠，12us 空泡被吸收，AIC 逼近 73+38=111us/专家</text>
  <text x="80" y="682" font-size="12" fill="#374151">· 1 专家/wave 只适合验证 wave 循环结构本身，不具备收益，不宜作为目标形态</text>

  <text x="60" y="706" font-size="10.5" fill="#6b7280">注：模拟基于实测单专家时长（D30 / G1 73 / S12 / G2 38 / C48，P/Q 与对应 GMM 重叠领先 2~5us）；wave 内顺序参考 A8W8 MegaMoeWave（AIC：G1(B)→G2(B)→G1(B+1)）；单核代表视图，实际按 tile 分布到各核。</text>
</svg>
