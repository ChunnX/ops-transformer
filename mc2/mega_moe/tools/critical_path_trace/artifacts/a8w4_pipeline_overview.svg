<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 白色画布背景：保证在浅色/深色主题下都可读 -->
  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <!-- ===================== 标题 / 口径 ===================== -->
  <text x="600" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">MegaMoe A8W4 完整算子流水示意图（单核代表视图，4 专家）</text>
  <text x="40" y="52" font-size="12" fill="#4b5563">缩写：G1=GMM1  G2=GMM2  D=dispatch  S=swiglu  C=combine  P=G1prologue  Q=G2prologue ｜ 一条流水 D→G1→S→G2→C；AIC / AIV0 / AIV1 并行 ｜ 数值均为单专家（us）</text>

  <!-- ===================== 图例 ===================== -->
  <g font-size="11.5" fill="#374151">
    <rect x="40" y="64" width="18" height="14" fill="#1d4ed8" rx="3"/>
    <text x="64" y="76">AIC·Cube（GMM1/GMM2）</text>
    <rect x="210" y="64" width="18" height="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="3"/>
    <text x="234" y="76">AIV0·prologue（W4→W8）</text>
    <rect x="410" y="64" width="18" height="14" fill="#f59e0b" rx="3"/>
    <text x="434" y="76">AIV1·dispatch（跨卡）</text>
    <rect x="600" y="64" width="18" height="14" fill="#10b981" rx="3"/>
    <text x="624" y="76">AIV1·swiglu</text>
    <rect x="760" y="64" width="18" height="14" fill="#8b5cf6" rx="3"/>
    <text x="784" y="76">AIV1·combine</text>
    <rect x="930" y="64" width="18" height="14" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <text x="954" y="76">空泡（等 GMM1）</text>
  </g>

  <!-- ===================== 泳道区：Phase1 + Phase2 同一时间轴 ===================== -->
  <!-- 阶段标签带 -->
  <rect x="100" y="100" width="644" height="20" fill="#eff6ff" rx="4"/>
  <text x="422" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Phase 1：GMM1 + SwiGLU（AIC-bound，G1 73us/专家）</text>
  <rect x="744" y="100" width="416" height="20" fill="#f5f3ff" rx="4"/>
  <text x="952" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">Phase 2：GMM2 + Combine（AIV1-bound，C 48us）</text>

  <!-- 算子整体起止标记 -->
  <line x1="100" y1="100" x2="100" y2="292" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">开始 t=0</text>
  <line x1="1156" y1="100" x2="1156" y2="292" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1156" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">结束 t=528</text>

  <!-- ===== AIC lane（GMM1 → GMM2） ===== -->
  <rect x="100" y="124" width="1056" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="151" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIC</text>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <rect x="160" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="233" y="150">G1(0) 73</text>
    <rect x="306" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="379" y="150">G1(1) 73</text>
    <rect x="452" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="525" y="150">G1(2) 73</text>
    <rect x="598" y="130" width="146" height="32" fill="#1d4ed8" rx="4"/>
    <text x="671" y="150">G1(3) 73</text>
    <rect x="744" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="782" y="150">G2(0) 38</text>
    <rect x="820" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="858" y="150">G2(1) 38</text>
    <rect x="896" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="930" y="150">G2(2) 38</text>
    <rect x="972" y="130" width="76" height="32" fill="#0891b2" rx="4"/>
    <text x="1010" y="150">G2(3) 38</text>
  </g>

  <!-- ===== AIV0 lane（权重 prologue，W4→W8：P=G1、Q=G2） ===== -->
  <rect x="100" y="184" width="1056" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="211" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIV0</text>
  <g font-size="11" fill="#134e4a" text-anchor="middle" font-weight="bold">
    <rect x="100" y="190" width="198" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="199" y="210">P0</text>
    <rect x="298" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="371" y="210">P1</text>
    <rect x="444" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="517" y="210">P2</text>
    <rect x="590" y="190" width="146" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="663" y="210">P3</text>
    <rect x="736" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="774" y="210">Q0</text>
    <rect x="812" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="850" y="210">Q1</text>
    <rect x="888" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="926" y="210">Q2</text>
    <rect x="964" y="190" width="76" height="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="1002" y="210">Q3</text>
  </g>

  <!-- ===== AIV1 lane（D/S → Combine） ===== -->
  <rect x="100" y="248" width="1056" height="44" fill="#f3f4f6" rx="6"/>
  <text x="90" y="275" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111827">AIV1</text>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <rect x="100" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="130" y="274" fill="#1f2937">D(0)</text>
    <rect x="160" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="190" y="274" fill="#1f2937">D(1)</text>
    <rect x="306" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="318" y="274" fill="#064e3b">S0</text>
    <rect x="330" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="360" y="274" fill="#1f2937">D(2)</text>
    <rect x="452" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="464" y="274" fill="#064e3b">S1</text>
    <rect x="476" y="254" width="60" height="32" fill="#f59e0b" rx="4"/>
    <text x="506" y="274" fill="#1f2937">D(3)</text>
    <rect x="598" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="610" y="274" fill="#064e3b">S2</text>
    <rect x="744" y="254" width="24" height="32" fill="#10b981" rx="4"/>
    <text x="756" y="274" fill="#064e3b">S3</text>
    <rect x="772" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="820" y="274">C(0) 48</text>
    <rect x="868" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="916" y="274">C(1) 48</text>
    <rect x="964" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="1012" y="274">C(2) 48</text>
    <rect x="1060" y="254" width="96" height="32" fill="#8b5cf6" rx="4"/>
    <text x="1108" y="274">C(3) 48</text>
  </g>
  <!-- 空泡 blocks（虚线，等 GMM1） -->
  <g font-size="10.5" fill="#6b7280" text-anchor="middle">
    <rect x="220" y="254" width="86" height="32" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="263" y="274">首空泡 43</text>
    <rect x="390" y="254" width="62" height="32" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="421" y="274">空泡 31</text>
    <rect x="536" y="254" width="62" height="32" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="567" y="274">空泡 31</text>
    <rect x="622" y="254" width="122" height="32" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
    <text x="683" y="274">尾空泡 61</text>
  </g>

  <!-- 对齐律：GMM1(e+1).start = swiglu(e).start（跨过 AIV0 泳道） -->
  <g stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" opacity="0.55">
    <line x1="306" y1="162" x2="306" y2="254"/>
    <line x1="452" y1="162" x2="452" y2="254"/>
    <line x1="598" y1="162" x2="598" y2="254"/>
  </g>

  <!-- combine 比 GMM2 晚启 14us（首 tile 等待） -->
  <line x1="744" y1="162" x2="772" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="782" y="242" font-size="10.5" fill="#dc2626">C 晚启 14us</text>

  <!-- ===== 时间轴（连续，1us=2px） ===== -->
  <line x1="100" y1="308" x2="1160" y2="308" stroke="#9ca3af" stroke-width="1"/>
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <line x1="100"  y1="304" x2="100"  y2="312" stroke="#9ca3af"/>
    <text x="100"  y="324">0</text>
    <line x1="300" y1="304" x2="300" y2="312" stroke="#9ca3af"/>
    <text x="300" y="324">100</text>
    <line x1="500" y1="304" x2="500" y2="312" stroke="#9ca3af"/>
    <text x="500" y="324">200</text>
    <line x1="700" y1="304" x2="700" y2="312" stroke="#9ca3af"/>
    <text x="700" y="324">300</text>
    <line x1="900" y1="304" x2="900" y2="312" stroke="#9ca3af"/>
    <text x="900" y="324">400</text>
    <line x1="1100" y1="304" x2="1100" y2="312" stroke="#9ca3af"/>
    <text x="1100" y="324">500</text>
    <line x1="1156" y1="304" x2="1156" y2="312" stroke="#9ca3af"/>
    <text x="1156" y="324">528</text>
  </g>
  <text x="100" y="344" font-size="10.5" fill="#6b7280">时间轴（us，1us＝2px）；0 起为 dispatch(0) 启动；G2(0) 紧贴 G1(3)（322us 起，其依赖的 S0 早已完成）</text>

  <!-- ===================== 算子总时长 ===================== -->
  <text x="600" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">算子总时长 ≈ 528us（t=0：D(0)/P(0) 启动 → t=528：C(3) 完成）</text>

  <!-- ===================== bound 小结 ===================== -->
  <text x="40" y="394" font-size="12.5" fill="#1e40af" font-weight="bold">Phase 1 ＝ AIC(GMM1)-bound</text>
  <text x="300" y="394" font-size="12" fill="#374151">AIC 73us/专家紧密排布；AIV1 忙 42us/专家（D30+S12），空泡 ~31us 良性（首空泡 43）</text>
  <text x="40" y="416" font-size="12.5" fill="#6d28d9" font-weight="bold">Phase 2 ＝ AIV1(combine)-bound</text>
  <text x="300" y="416" font-size="12" fill="#374151">C 48us/专家 &gt; G2 38us → AIC 每专家富余 ~10us；C 比 G2 晚启 14us（首 tile 等待）</text>
  <text x="40" y="438" font-size="12.5" fill="#0d9488" font-weight="bold">AIV0 ＝ 权重 prologue（非关键路径）</text>
  <text x="300" y="438" font-size="12" fill="#374151">逐专家紧密排布、与对应 GMM（G1/G2）重叠、领先 2~5us 结束（P0 与 D(0) 同时启动）</text>

  <!-- ===================== 结论 ===================== -->
  <rect x="40" y="464" width="1120" height="340" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="60" y="490" font-size="14" font-weight="bold" fill="#111827">结论（完整流水视角）</text>

  <text x="60" y="518" font-size="12.5" fill="#111827" font-weight="bold">一条流水，flag 依赖衔接（无全局屏障）</text>
  <text x="80" y="538" font-size="12" fill="#374151">· AIC 先跑 G1(0..3)、再跑 G2(0..3)；AIV1 先跑 D/S、再跑 C——本质是同一条 D→G1→S→G2→C 流水</text>
  <text x="80" y="556" font-size="12" fill="#374151">· G2(0) 紧贴 G1(3)、无空隙：G2(e) 只依赖 S(e)，而 S0/S1/S2 在 GMM1 阶段内早已完成</text>
  <text x="80" y="574" font-size="12" fill="#374151">· 衔接靠逐 wave/逐 tile 的 flag：dispatchToGmm1Flag、swigluToGmm2Flag、gmmToEpilogueFlag（无任务型 EndSync / 无 SyncAll，SyncAll 属 topkWeightsPrefetch 路径）</text>

  <text x="60" y="602" font-size="12.5" fill="#1e40af" font-weight="bold">Phase 1 ＝ AIC-bound（73us/专家）</text>
  <text x="80" y="622" font-size="12" fill="#374151">· 空泡良性：AIV1 忙 42us &lt; AIC 73us，往 AIV1 加活不提速；Phase1 只能靠减 GMM1 提速</text>

  <text x="60" y="650" font-size="12.5" fill="#6d28d9" font-weight="bold">Phase 2 ＝ AIV1-bound（C 48us &gt; G2 38us）</text>
  <text x="80" y="670" font-size="12" fill="#374151">· bound 方向与 Phase1 相反：Phase1 是 AIC 拖 AIV1，Phase2 是 AIV1 拖 AIC</text>

  <text x="60" y="698" font-size="12.5" fill="#dc2626" font-weight="bold">优化方向 ＝ 让跨段依赖更早重叠（并无“串行点”可消）</text>
  <text x="80" y="718" font-size="12" fill="#374151">· 没有 EndSync/SyncAll 全局屏障，两段按 flag 依赖自然流动；重叠程度取决于 flag 粒度与缓冲深度</text>
  <text x="80" y="736" font-size="12" fill="#374151">· 若放宽依赖粒度，让 C(e) 与 G1(e+1)/G2(e+1) 重叠，可吸收 Phase1 的 AIV1 空泡（~31us/专家）与 Phase2 的 AIC 富余（~10us/专家）</text>
  <text x="80" y="754" font-size="12" fill="#374151">· AIV0 的 G1/G2 prologue 均不在关键路径（逐专家紧密排布、领先对应 GMM 约 2~5us 结束），wave 化时可跨 wave 预取、无痛填充</text>

  <text x="60" y="782" font-size="10.5" fill="#6b7280">注：图为单核代表视图——专家按 tile 分布到各核，依赖为数据级（如 G2(0) 依赖的是对应 tile 的 swiglu，可能由其他核完成）；各核流水相近，此图近似成立。对齐律 GMM1(e+1).start ＝ swiglu(e).start（红虚线）；Phase1 含首专家（dispatch0/1 连续启动）；数值为单专家近似，随 token 分布浮动。</text>
</svg>
