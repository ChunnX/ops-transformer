# mc2/common 全量匹配清单(消费侧第一步先查本表)
# 生成: 2026-09-09  基线commit: 0a19c1eb2 (clean)
# 用途: 对每个修改文件, 先在本表匹配:
#   1) 扩展名命中 full_regression.non_header_extensions -> 全量
#   2) cpp路径命中 full_regression.cpp_no_same_header(无同名.h) -> 全量
#   3) 头路径命中 full_regression.headers_used_by_all_operators -> 全量
#   4) 头路径命中 full_regression.headers_no_reference -> 全量
# 其余.h属"测部分算子"类, 改查 {A2,A3,A5}.yaml 取ops; cpp先找同目录同名.h, 按.h规则走
# 最终算子集需叠加CMake depends反向闭包后去重

full_regression:
  non_header_extensions:
    - ".py"
    - ".json"
    - ".ini"
    - ".sh"
    - ".csv"
    - ".txt"
    - ".md"
  cpp_no_same_header:
      - common/op_graph/mc2_gen_task_ops_utils_arch35_stub.cpp
      - common/op_kernel/apace/tests/st/all_gather_quant_matmul/ubmem/src/main.cpp
      - common/op_kernel/apace/tests/st/all_gather_quant_matmul/urma/src/main.cpp
      - common/op_kernel/apace/tests/st/all_to_all_quant_matmul/src/main.cpp
      - common/op_kernel/apace/tests/st/quant_matmul_all_to_all/src/main.cpp
      - common/op_kernel/apace/tests/st/quant_matmul_reduce_scatter/ubmem/src/main.cpp
      - common/torch_extension/csrc/comm_channel_builder_manager.cpp
      - common/torch_extension/csrc/comm_context.cpp
      - common/torch_extension/csrc/elastic_buffer.cpp
  headers_used_by_all_operators:
      - common/op_host/op_tiling/mc2_tiling_struct.h
      - common/op_kernel/mc2_tiling_struct.h
      - common/utils/mc2_common_log.h
      - common/utils/mc2_log.h
      - common/utils/mc2_log_compat.h
  headers_no_reference:
      - common/op_kernel/all_gather_matmul_tiling.h
      - common/op_kernel/reduce_sum.h
      - common/utils/mc2_math_util.h
