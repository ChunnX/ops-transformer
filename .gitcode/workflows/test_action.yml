name: test_action

concurrency:
    max: 10
    exceed-action: QUEUE
    enable: true
    preemption:
      enable: true
      events: [mr_id]

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "0 */1 * * *"
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?test*' ]
  pr_comment:
      types: [ created ]
      keyword: '^(?:\/)?test*'

env:
  org_name: "${{ vars.ORG_NAME }}"
  repo_name: ${{atomgit.event.repository.name}}
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  TARGET_BRANCH: ${{atomgit.ref_name}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
stages:
  stage2:
    name: Compile
    jobs:
      JOB_x86_compile_ubuntu24_dis:
        name: Compile_X86_ubuntu24_dis
        uses: .gitcode/workflows/compile_action_test.yml
        with:
          task_name: 'Pre_Compile'
          arch: 'x64'
          package_name: 'cann-ops-nn_9.1.0_linux-x86_64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24 }}
    pre:
    - type: auto
    fail-fast: true
