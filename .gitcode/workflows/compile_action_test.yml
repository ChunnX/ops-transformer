name: compile_action_test

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string
      ge_st_rt2:
        required: false
        type: string
        default: ''
      arch:
        required: false
        type: string
        default: 'x64'
      package_name:
        required: false
        type: string
        default: ''
      spec:
        required: false
        type: string
        default: 'xlarge'

jobs:
  JOB_compile:
    name: Compile
    needs: []
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/compile.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: compile_acc
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            cd ${{ steps.process_checkout.outputs.path }}
            export task_name=${{ inputs.task_name }}
            export GE_ST_RT2=${{ inputs.ge_st_rt2 }}
            export GIT_TARGET_BRANCH=${{ env.TARGET_BRANCH }}
            export OS_TYPE=${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
            unset NB_NO_HOOK
            unset XCACHE_IN_NEXTBUILD
            unset NB_CACHE
            unset NB_RDECO_TOOL_PATH
            unset NB_UNLOAD_CMD_PATTERN
            export NB_LOCAL_CMD_PATTERN=CMakeScratch/TryCompile
            unset NB_RDECO_ENABLE
            env|grep NB
            env|grep XCACHE
            export JOB_NUM=64
            ls -al "${WORKSPACE}"/third_party
            BuildAccelerate bash compile.sh
            ls -al "${WORKSPACE}"/third_party
          AC_SERVER_IP: 172.27.24.172:172.27.21.11:172.27.16.21:172.27.26.226:172.27.21.217:172.27.25.11:172.27.18.206:172.27.28.19:172.27.31.229:172.27.24.180
          AC_DIS_IMAGE: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu24.04_x86:lv6_v2.1003
          #image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
          AC_MODE: dis
    if: "${{ default() }}"
    runs-on:
      - self-hosted
      - arch=${{ inputs.arch }}
      - spec=${{ inputs.spec }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
