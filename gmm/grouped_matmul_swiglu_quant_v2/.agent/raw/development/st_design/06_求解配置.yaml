solver:
  strategy: topological
  anchors:
    # Level 0: 独立采样因子（输入参数）
    - x.dtype
    - x.shape
    - x.format
    - x.exist
    - x.dimensions
    - weight.dtype
    - weight.shape
    - weight.format
    - weight.exist
    - weight.dimensions
    - groupList.dtype
    - groupList.shape
    - groupList.format
    - groupList.exist
    - groupList.dimensions
    - dequantMode.dtype
    - dequantMode.exist
    - dequantMode.value
    - dequantDtype.dtype
    - dequantDtype.exist
    - dequantDtype.value
    - quantMode.dtype
    - quantMode.exist
    - quantMode.value
    - groupListType.dtype
    - groupListType.exist
    - groupListType.value
    - tuningConfig.dtype
    - tuningConfig.exist
    - transpose_x.dtype
    - transpose_x.exist
    - transpose_x.value
    - transpose_w.dtype
    - transpose_w.exist
    - transpose_w.value

  derivation_order:
    level_0:
      # 输入Tensor基础属性
      - x.dtype
      - x.shape
      - x.format
      - x.exist
      - x.dimensions
      - weight.dtype
      - weight.shape
      - weight.format
      - weight.exist
      - weight.dimensions
      - groupList.dtype
      - groupList.shape
      - groupList.format
      - groupList.exist
      - groupList.dimensions
      # 标量/属性参数
      - dequantMode.dtype
      - dequantMode.exist
      - dequantMode.value
      - dequantDtype.dtype
      - dequantDtype.exist
      - dequantDtype.value
      - quantMode.dtype
      - quantMode.exist
      - quantMode.value
      - groupListType.dtype
      - groupListType.exist
      - groupListType.value
      - tuningConfig.dtype
      - tuningConfig.exist
      - transpose_x.dtype
      - transpose_x.exist
      - transpose_x.value
      - transpose_w.dtype
      - transpose_w.exist
      - transpose_w.value

    level_1:
      # 推导的Tensor属性（依赖x和weight的shape）
      - weightScale.dtype
      - weightScale.shape
      - weightScale.format
      - weightScale.exist
      - weightScale.dimensions
      - xScale.dtype
      - xScale.shape
      - xScale.format
      - xScale.exist
      - xScale.dimensions
      # 可选参数
      - weightAssistMatrix.dtype
      - weightAssistMatrix.shape
      - weightAssistMatrix.format
      - weightAssistMatrix.exist
      - weightAssistMatrix.dimensions
      - bias.dtype
      - bias.shape
      - bias.format
      - bias.exist
      - bias.dimensions
      - smoothScale.dtype
      - smoothScale.shape
      - smoothScale.format
      - smoothScale.exist
      - smoothScale.dimensions

    level_2:
      # 输出Tensor（依赖输入shape推导）
      - output.dtype
      - output.shape
      - output.format
      - output.exist
      - output.dimensions
      - outputScale.dtype
      - outputScale.shape
      - outputScale.format
      - outputScale.exist
      - outputScale.dimensions
