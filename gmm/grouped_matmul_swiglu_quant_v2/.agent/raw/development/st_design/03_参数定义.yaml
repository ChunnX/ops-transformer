parameters:
  # ========== 输入 Tensor 参数 ==========

  # 1. x: 激活矩阵（左矩阵）
  - name: "x"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: "ND"
    dimensions: [2]
    dtype_with_ranges:
      - dtype: "float8_e4m3fn"
        value_range: [[0, 0.001], [0.001, 0.01], [0.01, 1], [1, 2], [2, 10], [10, 100], [-0.001, 0], [-0.01, -0.001], [-1, -0.01], [-2, -1], [-10, -2], [-100, -10], [-1, 1], [-0.01, 0.01], [-100, 100], [0, 0], [-448.0, 448.0], [-448.0, -448.0], [448.0, 448.0], ["nan", "nan"]]

  # 2. weight: 权重矩阵（右矩阵）
  - name: "weight"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: "FRACTAL_NZ_C0_32"
    dimensions: [5]
    dtype_with_ranges:
      - dtype: "float4_e2m1"
        value_range: [[-6.0, 6.0], [0, 0], [-6.0, -6.0], [6.0, 6.0], [-1, 1], ["nan", "nan"]]

  # 3. weightScale: MX weight反量化缩放因子
  - name: "weightScale"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: "ND"
    dimensions: [4]
    dtype_with_ranges:
      - dtype: "float8_e8m0"
        value_range: [[0.001, 0.01], [0.01, 1], [1, 2], [2, 10], [10, 100], [100, 256], [256, 512], [0, 0], ["nan", "nan"]]

  # 4. weightAssistMatrix: 辅助矩阵（MxA8W4场景不使用）
  - name: "weightAssistMatrix"
    type: "aclTensor"
    required: false
    io_type: "input"
    format: "NA"
    dimensions: []
    dtype_with_ranges:
      - dtype: "float32"

  # 5. bias: 偏移值（MxA8W4场景不使用）
  - name: "bias"
    type: "aclTensor"
    required: false
    io_type: "input"
    format: "NA"
    dimensions: []
    dtype_with_ranges:
      - dtype: "float32"

  # 6. xScale: MX x反量化缩放因子
  - name: "xScale"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: "ND"
    dimensions: [3]
    dtype_with_ranges:
      - dtype: "float8_e8m0"
        value_range: [[0.001, 0.01], [0.01, 1], [1, 2], [2, 10], [10, 100], [100, 256], [256, 512], [0, 0], ["nan", "nan"]]

  # 7. smoothScale: 平滑缩放因子（MxA8W4场景不使用）
  - name: "smoothScale"
    type: "aclTensor"
    required: false
    io_type: "input"
    format: "NA"
    dimensions: []
    dtype_with_ranges:
      - dtype: "float32"

  # 8. groupList: 分组列表
  - name: "groupList"
    type: "aclTensor"
    required: true
    io_type: "input"
    format: "ND"
    dimensions: [1]
    dtype_with_ranges:
      - dtype: "int64"
        value_range: [[0, 1], [1, 2], [2, 10], [10, 100], [100, 1000], [0, 0], [1, 1], [1024, 1024], [-9223372036854775808, 9223372036854775807]]

  # ========== 输入 标量/属性 参数 ==========

  # 9. dequantMode: 反量化计算类型
  - name: "dequantMode"
    type: "int64_t"
    required: true
    io_type: "input"
    is_enum: true
    dtype_with_values:
      - dtype: "int64"
        value: [2]

  # 10. dequantDtype: 中间计算数据类型
  - name: "dequantDtype"
    type: "int64_t"
    required: true
    io_type: "input"
    is_enum: true
    dtype_with_values:
      - dtype: "int64"
        value: [0]

  # 11. quantMode: 量化计算类型
  - name: "quantMode"
    type: "int64_t"
    required: true
    io_type: "input"
    is_enum: true
    dtype_with_values:
      - dtype: "int64"
        value: [2]

  # 12. groupListType: 分组列表类型
  - name: "groupListType"
    type: "int64_t"
    required: true
    io_type: "input"
    is_enum: true
    dtype_with_values:
      - dtype: "int64"
        value: [0, 1]

  # 13. tuningConfig: 调优参数
  - name: "tuningConfig"
    type: "int64_t"
    required: false
    io_type: "input"
    is_enum: false
    dtype_with_values:
      - dtype: "int64"
        value_range: [[0, 1], [1, 2], [2, 10], [0, 0], [-9223372036854775808, 9223372036854775807]]

  # 14. transpose_x: 左矩阵转置标志
  - name: "transpose_x"
    type: "bool"
    required: true
    io_type: "input"
    is_enum: true
    dtype_with_values:
      - dtype: "bool"
        value: [false]

  # 15. transpose_w: 右矩阵转置标志
  - name: "transpose_w"
    type: "bool"
    required: true
    io_type: "input"
    is_enum: true
    dtype_with_values:
      - dtype: "bool"
        value: [true]

  # ========== 输出 Tensor 参数 ==========

  # 16. output: 量化后的输出矩阵
  - name: "output"
    type: "aclTensor"
    required: true
    io_type: "output"
    format: "ND"
    dimensions: [2]
    dtype_with_ranges:
      - dtype: "float8_e4m3fn"

  # 17. outputScale: 输出量化缩放因子
  - name: "outputScale"
    type: "aclTensor"
    required: true
    io_type: "output"
    format: "ND"
    dimensions: [3]
    dtype_with_ranges:
      - dtype: "float8_e8m0"
