[pytest]
markers =
    STC: STC batch cases (ci + debug)
    FUNC_RDV: RDV functional cases (precision validation)
    PERF_RDV: RDV performance cases (throughput/latency)
    PROF: PROF performance cases
    WHITEBOX: WHITEBOX cases
    REDLINE: REDLINE cases
log_cli = true
log_cli_format = %(message)s
log_cli_level = INFO
