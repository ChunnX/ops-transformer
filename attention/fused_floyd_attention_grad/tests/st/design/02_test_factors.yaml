# aclnnFusedFloydAttentionGrad 测试因子定义
# 来源: tests/st/design/01_parameter_description.md（步骤 2 映射产物）
operator_name: aclnnFusedFloydAttentionGrad

# ===== 中间因子（shape 轴语义变量，预算分配链：_h/_d 锚点 → _b → _n → _m → _k 级联预算收窄） =====
intermediate:
  _h:
    type: int64_t
    factors:
      _h.value_range:
        - [1, 1]
        - [1, 4]
        - [4, 16]
        - [16, 64]
        - [64, 256]
      # 来源: 01 约束关系 R2 "H：取值范围为1~256"（接口文档约束说明）；5 段覆盖完整文档范围
  _d:
    type: int64_t
    factors:
      _d.value: [32, 64, 128]
      # 来源: 01 约束关系 R6 "D：取值范围为32/64/128"（有限离散集合，显式枚举）
  _b:
    type: int64_t
    factors:
      _b.value_range:
        - [1, 1]
        - [1, 8]
        - [8, 64]
        - [64, 512]
        - [512, 2048]
      # 来源: 01 约束关系 R1 "B：取值范围为1~2K"（接口文档约束说明）；5 段覆盖完整文档范围；
      #       _b.value 由 @solves 按 2G shape 预算收窄（B*H*K*M*D ≤ 2G，K/M 下界 128）
  _n:
    type: int64_t
    factors:
      _n.value_range:
        - [16, 16]
        - [16, 256]
        - [256, 4096]
        - [4096, 65536]
        - [65536, 1048576]
      # 来源: 01 约束关系 R3 "N：取值范围为16~1M且N%16==0"；5 段覆盖完整文档范围；
      #       _n.value 由 @solves 做 16 对齐采样 + 2G 预算收窄
  _m:
    type: int64_t
    factors:
      _m.value_range:
        - [128, 128]
        - [128, 1024]
        - [1024, 16384]
        - [16384, 131072]
        - [131072, 1048576]
      # 来源: 01 约束关系 R4 "M：取值范围为128~1M且M%128==0"；5 段覆盖完整文档范围；
      #       _m.value 由 @solves 做 128 对齐采样 + 2G 预算收窄
  _k:
    type: int64_t
    factors:
      _k.value_range:
        - [128, 128]
        - [128, 1024]
        - [1024, 16384]
        - [16384, 131072]
        - [131072, 1048576]
      # 来源: 01 约束关系 R5 "K：取值范围为128~1M且K%128==0"；5 段覆盖完整文档范围；
      #       _k.value 由 @solves 做 128 对齐采样 + 2G 预算收窄

# ===== 算子参数 =====
query:
  type: aclTensor
  io_type: input
  support_empty_tensor: false
  # 来源: 01 参数表"空tensor"列 "不支持"（各轴下界均为正：B≥1/H≥1/N≥16/M≥128/D∈{32,64,128}，
  #       接口文档约束说明轴范围排除 0；host 代码 "input shape error, got 0 in bhmnkd" 佐证）
  factors:
    query.exist: [true]
    query.format: [ND]
    # 来源: 01 参数表"数据格式"列 "ND"（单一格式）
    query.dimensions: [5]
    # 来源: 01 参数表"维度/长度"列 "5维 [B,H,N,M,D]"
    query.dtype: [float16, bfloat16]
    # 来源: 01 参数表"数据类型"列 "FLOAT16、BFLOAT16"
    query.shape: []
    # 来源: @solved — R7/R10/R11/R14/R19 shape 约束链，由 _b/_h/_n/_m/_d 推导

key1:
  type: aclTensor
  io_type: input
  support_empty_tensor: false
  factors:
    key1.exist: [true]
    key1.format: [ND]
    key1.dimensions: [5]
    key1.dtype: [float16, bfloat16]
    key1.shape: []

