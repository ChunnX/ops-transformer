    value2.dtype: [float16, bfloat16]
    value2.shape: []

dy:
  type: aclTensor
  io_type: input
  support_empty_tensor: false
  factors:
    dy.exist: [true]
    dy.format: [ND]
    dy.dimensions: [5]
    dy.dtype: [float16, bfloat16]
    dy.shape: []

attenMaskOptional:
  type: aclTensor
  io_type: input
  support_empty_tensor: false
  factors:
    attenMaskOptional.exist: [true, false]
    # 来源: 01 参数表"必选/可选"列 "可选（推断自：参数名含Optional后缀 + README'可选输入'）"
    attenMaskOptional.format: [ND]
    attenMaskOptional.dimensions: [5]
    attenMaskOptional.dtype: [bool, uint8]
    # 来源: 01 参数表"数据类型"列 "BOOL、UINT8"
    attenMaskOptional.shape: []
    attenMaskOptional.value_range_bool:
      - [0, 0]
      - [1, 1]
      - [0, 1]
    # 来源: 01 约束关系 R20 元素值域 {0,1}（"取值为1代表该位不参与计算，为0代表该位参与计算"）；
    #       三段覆盖 全参与(0)/全掩蔽(1)/混合(0~1) 三种取数场景
    attenMaskOptional.value_range_uint8:
      - [0, 0]
      - [1, 1]
      - [0, 1]
    # 来源: 同上（uint8 dtype 的二值语义与 bool 一致）

softmaxMax:
  type: aclTensor
  io_type: input
  support_empty_tensor: false
  factors:
    softmaxMax.exist: [true]
    softmaxMax.format: [ND]
    softmaxMax.dimensions: [5]
    softmaxMax.dtype: [float32]
    # 来源: 01 参数表"数据类型"列 "FLOAT"（固定 float32）
    softmaxMax.shape: []

softmaxSum:
  type: aclTensor
  io_type: input
  support_empty_tensor: false
  factors:
    softmaxSum.exist: [true]
    softmaxSum.format: [ND]
    softmaxSum.dimensions: [5]
    softmaxSum.dtype: [float32]
    softmaxSum.shape: []

attentionIn:
  type: aclTensor
  io_type: input
  support_empty_tensor: false
  factors:
    attentionIn.exist: [true]
    attentionIn.format: [ND]
    attentionIn.dimensions: [5]
    attentionIn.dtype: [float16, bfloat16]
    attentionIn.shape: []

scaleValue:
  type: double
  io_type: input
  factors:
    scaleValue.exist: [true]
    scaleValue.dtype: [float64]
    # 来源: 01 参数表"数据类型"列 "DOUBLE"（固定单值，属性参数类型固定，不作为离散覆盖维度）
    scaleValue.value_range_float64:
      - [0, 0.001]
      - [0.001, 0.01]
      - [0.01, 1]
      - [1, 2]
      - [2, 10]
      - [10, 1000]
      - [-0.001, 0]
      - [-0.01, -0.001]
      - [-1, -0.01]
      - [-2, -1]
      - [-10, -2]
      - [-1000, -10]
      - [-1, 1]
      - [-0.01, 0.01]
      - [-100, 100]
      - [0, 0]
      - [1.0, 1.0]
      - [0.0884, 0.1768]
      - [3.4028235e+38, 3.4028235e+38]
      - [-3.4028235e+38, -3.4028235e+38]
      - [1.7976931348623157e+308, 1.7976931348623157e+308]
      - [-1.7976931348623157e+308, -1.7976931348623157e+308]
      - [2.2250738585072014e-308, 2.2250738585072014e-308]
      - [-2.2250738585072014e-308, -2.2250738585072014e-308]
      - ["-0", "-0"]
      - ["+0", "+0"]
      - ["-0", "+0"]
    # 来源: 01 参数表"取值范围"列 — dtype 数值边界集合（极值/零/±1 段/最小正数/±0）+ 文档语义边界
    #       （README "默认值为1.0" → [1.0,1.0] 退化段；调用示例 "1.0/sqrt(128)" → 典型 1/√D ∈ [0.0884,0.1768] 段）；
    #       scaleValue 为缩放系数属性（非 tensor 浮点输入），01 取值范围未定义 inf/nan 语义，
    #       与 spec.md §2.2 数据范围覆盖一致（零/±1/极值/最小正数/±0 + 语义边界），不含 inf/nan 段

dqOut:
