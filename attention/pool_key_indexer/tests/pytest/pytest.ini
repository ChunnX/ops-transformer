[pytest]
markers =
    smoke: 冒烟套件(torch 接口 eager/torchair GE/aclgraph 图可用性)
    precision: torch 单算子精度套件(定点 + 泛化 + 缺陷回归 + 边界计数)
    ge: GE 图模式(TorchAir)套件
    aclgraph: aclgraph(TorchAir reduce-overhead)防护套件(strict xfail, csrc 改造后应解除)
testpaths = .
python_files = test_*.py
python_functions = test_*
