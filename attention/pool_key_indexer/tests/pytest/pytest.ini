[pytest]
markers =
    smoke: 冒烟套件(torch 接口 eager/torchair GE/aclgraph 图可用性)
    precision: torch 单算子精度套件(定点 + 泛化 + 缺陷回归 + 边界计数)
    ge: GE 图模式(TorchAir)套件
    aclgraph: aclgraph/NPUGraph 图模式套件(torch_npu NPUGraph 捕获/回放 + device/host 取值输入变体 + 定点/泛化 + 缺陷回归 + 边界计数 + PA 变体)
testpaths = .
python_files = test_*.py
python_functions = test_*
