schema_version: 1

# The six business modes covered by the frozen profiles in 17adcfad.
# These are full-size validation/search workloads, not measured results.
defaults:
  world_size: 8
  expert_num: 256
  dtype: bfloat16
  route: balanced
  seed: 2026
  input_distribution: {kind: uniform, low: -5.0, high: 5.0}
  run: [accuracy, performance]
  accuracy:
    standard: opbase_experimental
    repeats: 2
    topk: 20
    heatmap_bins: 32
    dump_on_failure: true
  performance:
    warmup: 10
    align_iterations: 3
    iterations: 50
    repeats: 3
    max_rank_skew_ratio: 0.10
    max_regression_ratio: 0.00

cases:
  - id: a2avgmm_m131072_k2048_n1024_noexport
    operator: all_to_allv_grouped_mat_mul
    shape: {m: 131072, k: 2048, n: 1024}
    output_all_to_allv: false
  - id: a2avgmm_m131072_k2048_n1024_export
    operator: all_to_allv_grouped_mat_mul
    shape: {m: 131072, k: 2048, n: 1024}
    output_all_to_allv: true
  - id: a2avgmm_m131072_k2048_n512_noexport
    operator: all_to_allv_grouped_mat_mul
    shape: {m: 131072, k: 2048, n: 512}
    output_all_to_allv: false
  - id: a2avgmm_m131072_k2048_n512_export
    operator: all_to_allv_grouped_mat_mul
    shape: {m: 131072, k: 2048, n: 512}
    output_all_to_allv: true
  - id: gmma2av_m131072_k1024_n2048
    operator: grouped_mat_mul_all_to_allv
    shape: {m: 131072, k: 1024, n: 2048}
    output_all_to_allv: false
  - id: gmma2av_m131072_k512_n2048
    operator: grouped_mat_mul_all_to_allv
    shape: {m: 131072, k: 512, n: 2048}
    output_all_to_allv: false
