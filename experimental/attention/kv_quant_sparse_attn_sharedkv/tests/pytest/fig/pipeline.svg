<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" font-family="sans-serif">
  <rect x="0" y="0" width="880" height="590" fill="#ffffff"/>

  <!-- legend -->
  <rect x="700" y="12" width="14" height="14" fill="#D6EAF8" stroke="#5499C7"/>
  <text x="720" y="24" font-size="11" fill="#2C3E50">AIV</text>
  <rect x="760" y="12" width="14" height="14" fill="#FDEBD0" stroke="#E59866"/>
  <text x="780" y="24" font-size="11" fill="#2C3E50">AIC</text>

  <!-- ===================== BEFORE ===================== -->
  <text x="16" y="34" font-size="15" font-weight="bold" fill="#2C3E50">修改前：取数与产出同一轮 —— cube 等 KV</text>

  <!-- header row -->
  <rect x="196" y="44" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <rect x="292" y="44" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <rect x="388" y="44" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <rect x="484" y="44" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <text x="244" y="62" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i 轮</text>
  <text x="340" y="62" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i+1 轮</text>
  <text x="436" y="62" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i+2 轮</text>
  <text x="532" y="62" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i+3 轮</text>

  <!-- vec0 -->
  <text x="24" y="88" font-size="13" font-weight="bold" fill="#2C3E50">AIV · vec0</text>
  <text x="24" y="102" font-size="10" fill="#7F8C8D">UB 算 KV→写 GM</text>
  <rect x="196" y="72" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <rect x="292" y="72" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <rect x="388" y="72" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <rect x="484" y="72" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <text x="244" y="96" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>
  <text x="340" y="96" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+1</text>
  <text x="436" y="96" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+2</text>
  <text x="532" y="96" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+3</text>

  <!-- load -->
  <text x="24" y="126" font-size="13" font-weight="bold" fill="#2C3E50">AIC · load</text>
  <text x="24" y="140" font-size="10" fill="#7F8C8D">GM→L1（取数）</text>
  <rect x="196" y="110" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="292" y="110" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="388" y="110" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="484" y="110" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <text x="244" y="134" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>
  <text x="340" y="134" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+1</text>
  <text x="436" y="134" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+2</text>
  <text x="532" y="134" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+3</text>

  <!-- bmm1 -->
  <text x="24" y="164" font-size="13" font-weight="bold" fill="#2C3E50">AIC · bmm1</text>
  <text x="24" y="178" font-size="10" fill="#7F8C8D">Q·Kᵀ</text>
  <rect x="196" y="148" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="292" y="148" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="388" y="148" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="484" y="148" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <text x="244" y="172" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-1</text>
  <text x="340" y="172" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>
  <text x="436" y="172" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+1</text>
  <text x="532" y="172" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+2</text>

  <!-- bmm2 -->
  <text x="24" y="202" font-size="13" font-weight="bold" fill="#2C3E50">AIC · bmm2</text>
  <text x="24" y="216" font-size="10" fill="#7F8C8D">P·V</text>
  <rect x="196" y="186" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="292" y="186" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="388" y="186" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="484" y="186" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <text x="244" y="210" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-2</text>
  <text x="340" y="210" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-1</text>
  <text x="436" y="210" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>
  <text x="532" y="210" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+1</text>

  <!-- before highlight: vec0+load collide on 块 i at 第 i 轮 -->
  <rect x="196" y="72" width="96" height="38" fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-dasharray="5 3"/>
  <rect x="196" y="110" width="96" height="38" fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-dasharray="5 3"/>
  <line x1="580" y1="129" x2="592" y2="129" stroke="#E74C3C" stroke-width="1.2"/>
  <text x="596" y="126" font-size="11" fill="#E74C3C">load 与 vec0 同轮、同一块（第 i 轮均为块 i）</text>
  <text x="596" y="140" font-size="11" fill="#E74C3C">→ cube 等 AIV 产出 + 跨核同步</text>

  <text x="16" y="244" font-size="12" fill="#7F8C8D">同时产出、在用的 KV 矩阵 = 3 份；每轮 load 与 vec0 撞在一起，cube 空等一次。</text>

  <!-- separator -->
  <line x1="16" y1="296" x2="864" y2="296" stroke="#ECF0F1" stroke-width="1.5"/>

  <!-- ===================== AFTER ===================== -->
  <text x="16" y="334" font-size="15" font-weight="bold" fill="#2C3E50">修改后：load 比 vec0 晚一轮（cube 提前一轮预取）—— cube 不等</text>

  <!-- header row -->
  <rect x="196" y="344" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <rect x="292" y="344" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <rect x="388" y="344" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <rect x="484" y="344" width="96" height="28" fill="#EAECEE" stroke="#BDC3C7"/>
  <text x="244" y="362" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i 轮</text>
  <text x="340" y="362" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i+1 轮</text>
  <text x="436" y="362" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i+2 轮</text>
  <text x="532" y="362" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">第 i+3 轮</text>

  <!-- vec0 -->
  <text x="24" y="388" font-size="13" font-weight="bold" fill="#2C3E50">AIV · vec0</text>
  <text x="24" y="402" font-size="10" fill="#7F8C8D">UB 算 KV→写 GM</text>
  <rect x="196" y="372" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <rect x="292" y="372" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <rect x="388" y="372" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <rect x="484" y="372" width="96" height="38" fill="#D6EAF8" stroke="#5499C7"/>
  <text x="244" y="396" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>
  <text x="340" y="396" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+1</text>
  <text x="436" y="396" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+2</text>
  <text x="532" y="396" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+3</text>

  <!-- load -->
  <text x="24" y="426" font-size="13" font-weight="bold" fill="#2C3E50">AIC · load</text>
  <text x="24" y="440" font-size="10" fill="#7F8C8D">GM→L1（预取）</text>
  <rect x="196" y="410" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="292" y="410" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="388" y="410" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="484" y="410" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <text x="244" y="434" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-1</text>
  <text x="340" y="434" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>
  <text x="436" y="434" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+1</text>
  <text x="532" y="434" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+2</text>

  <!-- bmm1 -->
  <text x="24" y="464" font-size="13" font-weight="bold" fill="#2C3E50">AIC · bmm1</text>
  <text x="24" y="478" font-size="10" fill="#7F8C8D">Q·Kᵀ</text>
  <rect x="196" y="448" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="292" y="448" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="388" y="448" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="484" y="448" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <text x="244" y="472" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-2</text>
  <text x="340" y="472" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-1</text>
  <text x="436" y="472" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>
  <text x="532" y="472" font-size="13" fill="#2C3E50" text-anchor="middle">块 i+1</text>

  <!-- bmm2 -->
  <text x="24" y="502" font-size="13" font-weight="bold" fill="#2C3E50">AIC · bmm2</text>
  <text x="24" y="516" font-size="10" fill="#7F8C8D">P·V</text>
  <rect x="196" y="486" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="292" y="486" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="388" y="486" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <rect x="484" y="486" width="96" height="38" fill="#FDEBD0" stroke="#E59866"/>
  <text x="244" y="510" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-3</text>
  <text x="340" y="510" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-2</text>
  <text x="436" y="510" font-size="13" fill="#2C3E50" text-anchor="middle">块 i-1</text>
  <text x="532" y="510" font-size="13" fill="#2C3E50" text-anchor="middle">块 i</text>

  <!-- after highlight: trace 块 i diagonally across 4 rounds -->
  <polyline points="244,391 340,429 436,467 532,505" fill="none" stroke="#229954" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="196" y="372" width="96" height="38" fill="none" stroke="#229954" stroke-width="2.5"/>
  <rect x="292" y="410" width="96" height="38" fill="none" stroke="#229954" stroke-width="2.5"/>
  <rect x="388" y="448" width="96" height="38" fill="none" stroke="#229954" stroke-width="2.5"/>
  <rect x="484" y="486" width="96" height="38" fill="none" stroke="#229954" stroke-width="2.5"/>
  <text x="596" y="452" font-size="11" fill="#229954">绿框：同一份 KV 矩阵（块 i）</text>
  <text x="596" y="466" font-size="11" fill="#229954">历 4 轮 vec0→load→bmm1→bmm2</text>
  <text x="596" y="480" font-size="11" fill="#229954">load 比 vec0 晚一轮 → cube 不等</text>

  <text x="16" y="544" font-size="12" fill="#7F8C8D">同时产出、在用的 KV 矩阵 = 4 份；L1 仍只需 3 块缓冲（vec0 阶段的第 4 份还在 GM，未进 L1）。</text>
</svg>
