[pytest]
addopts = --strict-markers
testpaths = .
markers =
    offline: no torch, CANN or NPU required; test assets only
    npu: executes the installed QBSA operators on Ascend 950
    accuracy: 36 small STC cases; CPU golden plus same-input layout checks on TND cases
    contract: real Meta or NPU negative tests
    metadata: standalone metadata and optional-input regression
    graph: compiled graph execution or replay
    ttk: real TTK adapter integration
