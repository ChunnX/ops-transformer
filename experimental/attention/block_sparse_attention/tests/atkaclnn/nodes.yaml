# 节点顺序有语义: ATK 的 get_main_node() 就是 nodes[0], 必须是被测节点(pyaclnn)。
# 若把 cpu 写在前面, 主节点变成 cpu, 会有两个后果:
#   1. cv_fused_double_benchmark 的 fp32 真值任务被派到 pyaclnn 节点上(取每组的末节点);
#   2. 标杆的 output_info 传不到 pyaclnn, 报"标杆输出为空"。
# cpu 节点 name 沿用 atk-mxfp4 的 gpu, 双标杆比对按该名字取真值结果。
nodes:
  - backend: pyaclnn
    task: ['accuracy']
    devices: [1]
  - backend: cpu
    name: gpu
    task: ['accuracy']
    devices: [1]
