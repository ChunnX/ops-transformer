[pytest]
# 仅收集 pytest 框架入口文件，排除旧式脚本（test_quant_flash_attention.py /
# test_qfa_accuracy.py / test_qfa_performance.py / test_cases/）避免误收集。
python_files = test_quant_flash_attn_*.py
testpaths = .
norecursedirs = test_cases dump_data log extra-info common golden_cache

markers =
    ci: mark a test as a CI test
    func_rdv: mark a test as a functional correctness RDV test
    debug: mark a test as a daily debug test
