[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sageattention2-ascend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch==2.9.0", "torch_npu==2.9.0.post8"]
[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
