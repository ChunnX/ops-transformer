<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <linearGradient id="bgGradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="bgGradR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#121d38"/>
    </linearGradient>
    <linearGradient id="loadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="computeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="softmaxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accumGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="v2BarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="v3BarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Arrowhead symbols -->
    <symbol id="ahBlue" viewBox="0 0 10 6"><polygon points="0,1 8,3 0,5" fill="#60a5fa"/></symbol>
    <symbol id="ahRed" viewBox="0 0 10 6"><polygon points="0,1 8,3 0,5" fill="#f87171"/></symbol>
    <symbol id="ahGray" viewBox="0 0 10 6"><polygon points="0,1 8,3 0,5" fill="#94a3b8"/></symbol>
    <symbol id="ahGreen" viewBox="0 0 10 6"><polygon points="0,1 8,3 0,5" fill="#34d399"/></symbol>

    <!-- Icon: clock/wait -->
    <symbol id="iconWait" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
      <polyline points="8,4 8,8 11,10" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </symbol>
    <!-- Icon: bolt/compute -->
    <symbol id="iconBolt" viewBox="0 0 16 16">
      <polygon points="9,1 4,9 7,9 6,15 12,7 9,7 10,1" fill="#f87171"/>
    </symbol>
    <!-- Icon: download/load -->
    <symbol id="iconLoad" viewBox="0 0 16 16">
      <path d="M8,2 L8,10 M4,8 L8,12 L12,8 M2,13 L14,13" fill="none" stroke="#60a5fa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- Canvas background -->
  <rect width="1000" height="650" rx="0" fill="#030712"/>

  <!-- Top header bar -->
  <rect x="0" y="0" width="1000" height="48" fill="url(#headerGrad)"/>
  <text x="500" y="30" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="20" font-weight="bold">H100 Warp Group Specialization — 异步流水线 (Asynchronous Pipeline)</text>

  <!-- Decorative divider dots -->
  <circle cx="160" cy="24" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="180" cy="24" r="2" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="820" cy="24" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="840" cy="24" r="2" fill="#f59e0b" opacity="0.4"/>

  <!-- ============================================ -->
  <!-- LEFT: Traditional A100 (Sequential) -->
  <!-- ============================================ -->
  <rect x="20" y="60" width="445" height="340" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Panel label -->
  <rect x="20" y="60" width="445" height="28" rx="8" fill="#1e293b"/>
  <rect x="20" y="74" width="445" height="14" fill="#1e293b"/>
  <text x="242" y="79" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">V2 传统模式 (A100) — 单个 Warp Group 串行执行</text>

  <!-- Left timeline axis -->
  <line x1="60" y1="108" x2="60" y2="378" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="56,103 60,96 64,103" fill="#475569"/>
  <text x="42" y="100" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="9">时间</text>
  <text x="42" y="112" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="9">↓</text>

  <!-- Row 1 icons -->
  <use href="#iconLoad" x="72" y="118"/>
  <!-- Block 1: Load K,V -->
  <rect x="92" y="114" width="210" height="22" rx="4" fill="url(#loadGrad)"/>
  <text x="197" y="129" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Load K₁, V₁ (HBM → SRAM)</text>
  <!-- Arrow down -->
  <line x1="197" y1="136" x2="197" y2="148" stroke="#475569" stroke-width="1"/>
  <polygon points="192,146 197,154 202,146" fill="#475569"/>

  <!-- Block 2: Compute QK^T -->
  <use href="#iconBolt" x="72" y="156"/>
  <rect x="92" y="152" width="210" height="22" rx="4" fill="url(#computeGrad)"/>
  <text x="197" y="167" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Compute QK₁ᵀ (Tensor Core)</text>
  <line x1="197" y1="174" x2="197" y2="186" stroke="#475569" stroke-width="1"/>
  <polygon points="192,184 197,192 202,184" fill="#475569"/>

  <!-- Block 3: Softmax -->
  <rect x="92" y="190" width="210" height="22" rx="4" fill="url(#softmaxGrad)"/>
  <text x="197" y="205" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Softmax (Online)</text>
  <line x1="197" y1="212" x2="197" y2="224" stroke="#475569" stroke-width="1"/>
  <polygon points="192,222 197,230 202,222" fill="#475569"/>

  <!-- Block 4: Compute PV -->
  <use href="#iconBolt" x="72" y="232"/>
  <rect x="92" y="228" width="210" height="22" rx="4" fill="url(#computeGrad)"/>
  <text x="197" y="243" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Compute P₁V₁ (Tensor Core)</text>

  <!-- Separator with annotation -->
  <rect x="310" y="260" width="145" height="16" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="382" y="272" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="8">迭代完成, 开始下一轮</text>

  <line x1="197" y1="250" x2="197" y2="284" stroke="#475569" stroke-width="1"/>
  <polygon points="192,282 197,290 202,282" fill="#475569"/>

  <!-- Row 2 -->
  <use href="#iconLoad" x="72" y="294"/>
  <rect x="92" y="290" width="210" height="22" rx="4" fill="url(#loadGrad)"/>
  <text x="197" y="305" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Load K₂, V₂ (HBM → SRAM)</text>

  <line x1="197" y1="312" x2="197" y2="324" stroke="#475569" stroke-width="1"/>
  <polygon points="192,322 197,330 202,322" fill="#475569"/>

  <use href="#iconBolt" x="72" y="332"/>
  <rect x="92" y="328" width="210" height="22" rx="4" fill="url(#computeGrad)"/>
  <text x="197" y="343" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Compute QK₂ᵀ (Tensor Core)</text>

  <line x1="197" y1="350" x2="197" y2="362" stroke="#475569" stroke-width="1"/>
  <polygon points="192,360 197,368 202,360" fill="#475569"/>

  <use href="#iconBolt" x="72" y="370"/>
  <rect x="92" y="366" width="210" height="22" rx="4" fill="url(#computeGrad)"/>
  <text x="197" y="381" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Softmax + P₂V₂ + ...</text>

  <!-- Stall warning -->
  <rect x="315" y="118" width="140" height="46" rx="5" fill="#1a1220" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="385" y="136" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="8">⚠ 串行瓶颈</text>
  <text x="385" y="150" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="7">计算时 HBM 空闲</text>
  <text x="385" y="161" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="7">加载时 TensorCore 空闲</text>

  <!-- ============================================ -->
  <!-- RIGHT: Hopper H100 (Async Pipeline) -->
  <!-- ============================================ -->
  <rect x="485" y="60" width="495" height="340" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="485" y="60" width="495" height="28" rx="8" fill="#1e293b"/>
  <rect x="485" y="74" width="495" height="14" fill="#1e293b"/>
  <text x="732" y="79" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">V3 异步流水线 (H100) — Producer / Consumer 双 Warp Group</text>

  <!-- ===== Producer WG Container ===== -->
  <rect x="500" y="100" width="215" height="155" rx="8" fill="#0c1929" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="500" y="100" width="215" height="24" rx="8" fill="#2563eb" opacity="0.85"/>
  <rect x="500" y="108" width="215" height="16" fill="#2563eb" opacity="0.85"/>
  <text x="607" y="116" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Producer WG (TMA 数据加载)</text>

  <!-- Producer timeline -->
  <line x1="525" y1="134" x2="525" y2="246" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="510" y="138" text-anchor="end" fill="#60a5fa" font-family="sans-serif" font-size="7">t→</text>

  <!-- P Block 1: TMA K1 -->
  <use href="#iconLoad" x="537" y="140"/>
  <rect x="555" y="136" width="148" height="20" rx="3" fill="#2563eb"/>
  <text x="629" y="150" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">TMA Load K₁ (async)</text>
  <line x1="629" y1="156" x2="629" y2="166" stroke="#3b82f6" stroke-width="0.7"/>
  <polygon points="625,164 629,170 633,164" fill="#3b82f6"/>

  <!-- P Block 2: TMA V1 -->
  <use href="#iconLoad" x="537" y="173"/>
  <rect x="555" y="170" width="148" height="20" rx="3" fill="#2563eb"/>
  <text x="629" y="184" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">TMA Load V₁ (async)</text>
  <line x1="629" y1="190" x2="629" y2="200" stroke="#3b82f6" stroke-width="0.7"/>
  <polygon points="625,198 629,204 633,198" fill="#3b82f6"/>

  <!-- Barrier 1 -->
  <rect x="560" y="202" width="138" height="18" rx="9" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="629" y="215" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold">| barrier₁ |</text>
  <line x1="629" y1="220" x2="629" y2="230" stroke="#3b82f6" stroke-width="0.7"/>
  <polygon points="625,228 629,234 633,228" fill="#3b82f6"/>

  <!-- P Block 3: TMA K2 -->
  <rect x="555" y="232" width="148" height="20" rx="3" fill="#2563eb"/>
  <text x="629" y="246" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">TMA Load K₂ (async)</text>

  <!-- ===== Consumer WG Container ===== -->
  <rect x="735" y="100" width="230" height="155" rx="8" fill="#1a1510" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="735" y="100" width="230" height="24" rx="8" fill="#dc2626" opacity="0.85"/>
  <rect x="735" y="108" width="230" height="16" fill="#dc2626" opacity="0.85"/>
  <text x="850" y="116" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Consumer WG (WGMMA 计算)</text>

  <!-- Consumer timeline -->
  <line x1="760" y1="134" x2="760" y2="246" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="745" y="138" text-anchor="end" fill="#f87171" font-family="sans-serif" font-size="7">t→</text>

  <!-- C Block: wait barrier -->
  <use href="#iconWait" x="772" y="138"/>
  <rect x="790" y="136" width="160" height="20" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="870" y="150" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold">| wait barrier₁ |</text>
  <line x1="870" y1="156" x2="870" y2="166" stroke="#ef4444" stroke-width="0.7"/>
  <polygon points="866,164 870,170 874,164" fill="#ef4444"/>

  <!-- C Block: WGMMA QK -->
  <use href="#iconBolt" x="772" y="173"/>
  <rect x="790" y="170" width="160" height="20" rx="3" fill="#dc2626"/>
  <text x="870" y="184" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">WGMMA QK₁ᵀ</text>
  <line x1="870" y1="190" x2="870" y2="200" stroke="#ef4444" stroke-width="0.7"/>
  <polygon points="866,198 870,204 874,198" fill="#ef4444"/>

  <!-- C Block: Softmax -->
  <rect x="790" y="202" width="160" height="20" rx="3" fill="url(#softmaxGrad)"/>
  <text x="870" y="216" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">Online Softmax</text>

  <!-- C Block: WGMMA PV + Acc -->
  <rect x="790" y="226" width="160" height="26" rx="3" fill="url(#accumGrad)"/>
  <text x="870" y="240" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">WGMMA P₁V₁ + Accum</text>

  <!-- ===== Overlap Visualization Box ===== -->
  <rect x="500" y="268" width="465" height="125" rx="8" fill="#0c1522" stroke="#334155" stroke-width="1"/>
  <text x="732" y="286" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">流水线重叠示意 (Pipeline Overlap)</text>

  <!-- Overlap rows -->
  <text x="512" y="308" fill="#60a5fa" font-family="sans-serif" font-size="8">Produce:</text>
  <text x="512" y="332" fill="#f87171" font-family="sans-serif" font-size="8">Consume:</text>

  <!-- Iteration 1 -->
  <rect x="580" y="300" width="130" height="16" rx="3" fill="#2563eb" opacity="0.8"/>
  <text x="645" y="312" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">TMA K₂, V₂</text>

  <rect x="580" y="324" width="100" height="16" rx="3" fill="#dc2626" opacity="0.8"/>
  <text x="630" y="336" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">WGMMA P₁V₁</text>

  <!-- Iteration 2 -->
  <rect x="715" y="300" width="130" height="16" rx="3" fill="#2563eb" opacity="0.8"/>
  <text x="780" y="312" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">TMA K₃, V₃</text>

  <rect x="715" y="324" width="100" height="16" rx="3" fill="#dc2626" opacity="0.8"/>
  <text x="765" y="336" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">WGMMA P₂V₂</text>

  <!-- Iteration 3 -->
  <rect x="850" y="300" width="110" height="16" rx="3" fill="#2563eb" opacity="0.7"/>
  <text x="905" y="312" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">K₄,V₄ → ...</text>

  <rect x="850" y="324" width="110" height="16" rx="3" fill="#dc2626" opacity="0.7"/>
  <text x="905" y="336" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">P₃V₃ → ...</text>

  <!-- Benefit annotation -->
  <rect x="512" y="352" width="440" height="34" rx="5" fill="#0a1a14" stroke="#10b981" stroke-width="0.8"/>
  <use href="#iconBolt" x="520" y="361" transform="scale(0.8) translate(130,90)"/>
  <text x="742" y="366" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="9">✓ Producer / Consumer 并行：HBM 带宽与 Tensor Core 算力同时饱和</text>
  <text x="742" y="380" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="8">TMA (Tensor Memory Accelerator) + WGMMA (Warp Group MMA) + CP Async Barriers</text>

  <!-- ============================================ -->
  <!-- Legend -->
  <!-- ============================================ -->
  <rect x="500" y="402" width="465" height="0" rx="0" fill="none"/>

  <!-- ============================================ -->
  <!-- BOTTOM: Performance Comparison -->
  <!-- ============================================ -->
  <rect x="20" y="410" width="960" height="230" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="500" y="434" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold">性能对比 (Performance Comparison) — FP16/BF16, 128K context, single H100</text>

  <!-- V2 Performance -->
  <rect x="60" y="456" width="140" height="40" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="472" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">V2 同步</text>
  <text x="130" y="488" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">(A100 架构)</text>

  <!-- V2 bar -->
  <rect x="220" y="462" width="370" height="28" rx="6" fill="url(#v2BarGrad)"/>
  <text x="235" y="480" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="bold">~550 TFLOPS</text>

  <!-- V3 Performance -->
  <rect x="60" y="510" width="140" height="40" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="526" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">V3 异步</text>
  <text x="130" y="542" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">(H100 架构)</text>

  <!-- V3 bar -->
  <rect x="220" y="516" width="500" height="28" rx="6" fill="url(#v3BarGrad)"/>
  <text x="235" y="534" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="bold">~740 TFLOPS</text>

  <!-- 1.35x badge -->
  <rect x="740" y="454" width="190" height="44" rx="10" fill="#0a1a14" stroke="#10b981" stroke-width="1.5"/>
  <text x="835" y="474" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold">1.35×</text>
  <text x="835" y="490" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="11">吞吐量提升</text>

  <!-- Arrow V2→V3 -->
  <line x1="590" y1="490" x2="590" y2="508" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="585,506 590,514 595,506" fill="#10b981"/>

  <!-- Technique badges at bottom -->
  <rect x="60" y="568" width="200" height="32" rx="6" fill="#0c1929" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="160" y="582" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="9" font-weight="bold">TMA — 异步 2D/3D 块传输</text>
  <text x="160" y="594" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="8">Tensor Memory Accelerator</text>

  <rect x="280" y="568" width="230" height="32" rx="6" fill="#1a1510" stroke="#ef4444" stroke-width="0.8"/>
  <text x="395" y="582" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="bold">WGMMA — 异步张量核指令</text>
  <text x="395" y="594" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="8">Warp Group Matrix Multiply-Accumulate</text>

  <rect x="530" y="568" width="210" height="32" rx="6" fill="#14141a" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="635" y="582" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">CP Async Barriers</text>
  <text x="635" y="594" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="8">Producer-Consumer 同步原语</text>

  <rect x="760" y="568" width="210" height="32" rx="6" fill="#141a14" stroke="#10b981" stroke-width="0.8"/>
  <text x="865" y="582" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">Warp Group Specialization</text>
  <text x="865" y="594" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="8">Producer / Consumer 角色分离</text>

</svg>
