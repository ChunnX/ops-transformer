repos:
  # clang-format disabled: avoid mass reformat on commit.
  # Use editor format-on-save + .clang-format (ColumnLimit 120) instead.

  # OAT compliance check (Open Source Audit Tool)
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: true
        types: [file]
        stages: [pre-commit]
        verbose: true
